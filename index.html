<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Thermal Management Calculator v0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .transition-all {
            transition: all 0.4s ease-in-out;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.1), 0 4px 6px -2px rgba(139, 92, 246, 0.05);
            border-color: #8b5cf6;
        }

        .input-field {
            margin-top: 0.25rem; /* mt-1 */
            display: block; /* block */
            width: 100%; /* w-full */
            background-color: #111827; /* bg-gray-900 */
            border: 1px solid #374151; /* border-gray-700 */
            border-radius: 0.375rem; /* rounded-md */
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); /* shadow-sm */
            color: #ffffff; /* text-white */
        }

        .input-field::placeholder {
            color: #6b7280; /* placeholder-gray-500 */
        }

        .input-field:focus {
            outline: none;
            border-color: #8b5cf6; /* focus:border-violet-500 */
            box-shadow: 0 0 0 3px rgb(139 92 246 / 0.5); /* focus:ring-violet-500 */
        }

        .btn-secondary {
            padding: 0.5rem 1rem; /* px-4 py-2 */
            background-color: #1f2937; /* bg-gray-800 */
            color: #ffffff; /* text-white */
            font-weight: 600; /* font-semibold */
            border-radius: 0.375rem; /* rounded-md */
            transition: all 0.2s; /* transition-all */
        }

        .btn-secondary:hover {
            background-color: #374151; /* hover:bg-gray-700 */
        }

        .btn-secondary:focus {
            outline: none; /* focus:outline-none */
            box-shadow: 0 0 0 2px #8b5cf6, 0 0 0 4px #111827; /* ring */
        }

        .chart-line {
            transition: d 0.5s ease-in-out;
        }

        .status-indicator {
            padding: 0.25rem 0.75rem; /* px-3 py-1 */
            font-size: 0.75rem; /* text-xs */
            font-weight: 500; /* font-medium */
            border-radius: 9999px; /* rounded-full */
            transition: background-color 0.2s, color 0.2s; /* transition-colors */
        }

        .status-inactive {
            background-color: #374151; /* bg-gray-700 */
            color: #9ca3af; /* text-gray-400 */
        }

        .status-active {
            background-color: #eab308; /* bg-yellow-500 */
            color: #000000; /* text-black */
        }

        .status-sweating {
            background-color: #3b82f6; /* bg-blue-500 */
            color: #ffffff; /* text-white */
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <button id="lang-switcher" class="fixed top-4 right-4 btn-secondary z-50" data-t="switch_lang"></button>

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-white"><span data-t="main_title"></span> <span
                    class="text-base bg-violet-600 text-white rounded-full px-3 py-1 align-middle"
                    data-t="version_badge"></span>
            </h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <div class="space-y-6">
                <div class="card p-6 rounded-xl transition-all card-hover">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-violet-400 pl-3"
                        data-t="param_input"></h2>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-300" data-t="gender"></label>
                            <select id="gender" class="input-field">
                                <option value="male" data-t="male"></option>
                                <option value="female" data-t="female" selected></option>
                            </select>
                        </div>
                        <div>
                            <label for="height" class="block text-sm font-medium text-gray-300" data-t="height"></label>
                            <input type="number" id="height" value="165" class="input-field">
                        </div>
                        <div>
                            <label for="weight" class="block text-sm font-medium text-gray-300" data-t="weight"></label>
                            <input type="number" id="weight" value="50" class="input-field">
                        </div>
                        <div>
                            <label for="age" class="block text-sm font-medium text-gray-300" data-t="age"></label>
                            <input type="number" id="age" value="17" class="input-field">
                        </div>
                        <div>
                            <label for="core-temp" class="block text-sm font-medium text-gray-300"
                                data-t="core_temp"></label>
                            <input type="number" id="core-temp" value="36.6" step="0.1" class="input-field">
                        </div>
                        <div>
                            <label for="temperature" class="block text-sm font-medium text-gray-300"
                                data-t="temperature"></label>
                            <input type="number" id="temperature" value="5" class="input-field">
                        </div>
                        <div>
                            <label for="wind" class="block text-sm font-medium text-gray-300"
                                data-t="wind_speed"></label>
                            <input type="number" id="wind" value="15" class="input-field">
                        </div>
                        <div>
                            <label for="humidity" class="block text-sm font-medium text-gray-300"
                                data-t="humidity"></label>
                            <input type="number" id="humidity" value="50" step="1" min="0" max="100"
                                class="input-field">
                        </div>
                        <div>
                            <label for="solar-level" class="block text-sm font-medium text-gray-300"
                                data-t="solar_radiation"></label>
                            <select id="solar-level" class="input-field">
                                <option value="0" data-t="solar_level_no"></option>
                                <option value="200" data-t="solar_level_overcast"></option>
                                <option value="400" data-t="solar_level_cloudy" selected></option>
                                <option value="600" data-t="solar_level_sunny"></option>
                                <option value="800" data-t="solar_level_intense"></option>
                            </select>
                        </div>
                        <div>
                            <label for="activity" class="block text-sm font-medium text-gray-300"
                                data-t="activity_level"></label>
                            <select id="activity" class="input-field">
                                <option value="1.0" data-t="activity_sit"></option>
                                <option value="1.2" data-t="activity_office"></option>
                                <option value="1.5" data-t="activity_light"></option>
                                <option value="2.6" data-t="activity_walk" selected></option>
                                <option value="3.0" data-t="activity_brisk_walk"></option>
                                <option value="6.0" data-t="activity_jog"></option>
                                <option value="8.0" data-t="activity_run"></option>
                                <option value="10.0" data-t="activity_vigorous"></option>
                            </select>
                        </div>
                        <div>
                            <label for="duration" class="block text-sm font-medium text-gray-300"
                                data-t="exposure_duration"></label>
                            <input type="number" id="duration" value="30" class="input-field">
                        </div>
                    </div>
                </div>

                <div class="card p-6 rounded-xl transition-all card-hover">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-cyan-400 pl-3"
                        data-t="outfit_composition"></h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-300" data-t="add_clothing"></label>
                            <div class="flex space-x-2"><select id="clothing-item"
                                    class="input-field flex-grow"></select>
                                <select id="thickness-modifier" class="input-field w-32"></select>
                                <button id="add-clothing-btn" class="btn-secondary" data-t="add_btn"></button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-300" data-t="current_outfit"></label>
                            <div id="current-outfit-list"
                                class="space-y-2 min-h-[8rem] p-2 rounded-md bg-gray-900 border border-gray-700">
                                <p id="empty-outfit-msg" class="text-gray-500 italic" data-t="empty_outfit"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="card p-6 rounded-xl">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-fuchsia-500 pl-3"
                        data-t="dashboard_title"></h2>
                    <div id="simulation-results-container" class="text-center">
                        <div class="mb-6">
                            <p class="text-sm text-gray-400" data-t="core_temp_prediction"></p>
                            <div id="simulation-summary"
                                class="text-4xl font-bold p-3 rounded-lg h-24 flex items-center justify-center transition-all duration-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <p class="text-sm text-gray-400" data-t="total_clo"></p>
                                <p id="total-clo" class="text-2xl font-semibold text-violet-300">0.00 Clo</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="effective_clo"></p>
                                <p id="effective-clo" class="text-2xl font-semibold text-sky-300">0.00 Clo</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="physiological_status"></p>
                                <div id="physiology-status-container" class="flex justify-center items-center h-10">
                                    <p id="physiology-status-text" class="text-lg font-semibold text-green-400"
                                        data-t="status_stable">
                                    </p>
                                </div>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="comfort_score"></p>
                                <p id="comfort-score" class="text-2xl font-semibold text-gray-500">-- / 100</p>
                            </div>
                        </div>

                        <div id="chart-container"
                            class="w-full h-96 bg-gray-900 rounded-lg p-2 mt-4 border-border-gray-700 relative">
                            <canvas id="simulation-chart"></canvas>
                            <div id="hover-label"
                                class="absolute hidden bg-gray-800 text-white text-xs font-bold px-2 py-1 rounded-md shadow-lg pointer-events-none z-10">
                            </div>
                        </div>
                        <div id="chart-controls" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-2 text-sm">
                        </div>

                        <div id="detailed-status-container" class="mt-6 text-left">
                            <h3 class="text-lg font-bold mb-3 text-white border-b-2 border-gray-700 pb-1"
                                data-t="detailed_status_title"></h3>
                            <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
                                <div></div>
                                <div class="text-right text-xs text-gray-400 -mb-1" data-t="final_avg_header"></div>
                                <!-- Heat Gain -->
                                <div class="text-green-400 font-semibold" data-t="heat_gain"></div>
                                <div></div>
                                <div class="pl-4" data-t="metabolic_gain"></div>
                                <div id="detail-metabolic" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="solar_gain"></div>
                                <div id="detail-solar" class="text-right font-mono">0 W</div>
                                <!-- Heat Loss -->
                                <div class="text-red-400 font-semibold mt-2" data-t="heat_loss"></div>
                                <div></div>
                                <div class="pl-4" data-t="respiratory_loss"></div>
                                <div id="detail-respiratory" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="dry_loss"></div>
                                <div id="detail-dry" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="sweat_loss"></div>
                                <div id="detail-sweat" class="text-right font-mono">0 W</div>
                                <!-- Net -->
                                <div class="text-yellow-400 font-semibold mt-2" data-t="final_net_rate"></div>
                                <div id="detail-net" class="text-right font-mono font-bold">0 W</div>
                                <!-- Response -->
                                <div class="text-blue-400 font-semibold mt-2" data-t="physiological_response"></div>
                                <div></div>
                                <div class="pl-4" data-t="shivering_intensity"></div>
                                <div id="detail-shivering" class="text-right font-mono">0 %</div>
                                <div class="pl-4" data-t="sweating_intensity"></div>
                                <div id="detail-sweating" class="text-right font-mono">0 %</div>
                                <div class="pl-4" data-t="vaso_regulation_intensity"></div>
                                <div id="detail-vasoregulation" class="text-right font-mono">0 %</div>
                            </div>
                        </div>

                        <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button id="import-csv-btn" class="btn-secondary w-full" data-t="import_csv_btn"></button>
                            <button id="export-csv-btn" class="btn-secondary w-full" data-t="export_csv_btn"></button>
                            <input type="file" id="csv-file-input" class="hidden" accept=".csv">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function calculateRegionalClo() {
            const LAYERING_EFFICIENCY = 0.70;
            const regionalClo = {};
            for (const regionKey in bodyRegions) {
                const layersForRegion = currentOutfit
                    .filter(item => item.regionalClo.hasOwnProperty(regionKey))
                    .map(item => {
                        const baseClo = item.regionalClo[regionKey];
                        const modifier = item.modifier || 1.0;
                        return baseClo * modifier;
                    })
                    .sort((a, b) => b - a);
                let effectiveClo = 0, efficiency = 1.0;
                for (const layerClo of layersForRegion) {
                    effectiveClo += layerClo * efficiency;
                    efficiency *= LAYERING_EFFICIENCY;
                }
                regionalClo[regionKey] = effectiveClo;
            }
            return regionalClo;
        }

                // Sum up the clo values for all regions covered by the item
                for (const region in item.regionalClo) {
                    if (item.regionalClo.hasOwnProperty(region)) {
                        simpleSumClo += item.regionalClo[region] * modifier;
                    }
                }
            });

            for (const regionKey in regionalClo) {
                const areaFraction = bodyRegions[regionKey] || 0;
                weightedClo += regionalClo[regionKey] * areaFraction;

            const windMs = windKmh / 3.6;

            if (isNaN(humidityPercent) || humidityPercent < 0 || humidityPercent > 100) return;

            const BSA = 0.007184 * Math.pow(heightCm, 0.725) * Math.pow(weightKg, 0.425);
            const bmi = weightKg / Math.pow(heightCm / 100, 2);
            const bodyFatPercentage = gender === 'female' ? (1.20 * bmi) + (0.23 * age) - 5.4 : (1.20 * bmi) + (0.23 * age) - 16.2;

            const regionalClo = calculateRegionalClo(); // Get per-region insulation values

            // BMR calculation using Mifflin-St Jeor equation (kcal/day)
            let bmrKcal;
            if (gender === 'female') {
                bmrKcal = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
            } else {
                bmrKcal = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
            }
            const bmrWatts = bmrKcal * 0.04843; // Convert kcal/day to Watts

            // Physiological response thresholds and parameters (cold)
            const SHIVERING_THRESHOLD = coreTemp - 0.3;
            const MAX_SHIVERING_MET_INCREASE = 4.0; // maximum shivering metabolic increase (Met)

            // Physiological response thresholds and parameters (hot)

            // Effective coefficient used in simulation: 0.12
            const SOLAR_EFFECTIVE_FACTOR = 0.12;

            const calculateConvectiveCoefficient = (v) => {

                return 8.3 * Math.pow(v, 0.6); // ISO 7933: h_c = 8.3 * v^0.6
            };
            const h_c = calculateConvectiveCoefficient(windMs);
            const h_r = 4.7; // Typical radiative heat transfer coefficient (W/(m²·K))
            const h_e = h_c + h_r; // Overall external heat transfer coefficient

            // New two-node model helper functions
            const calculateRespiratoryLoss = (metabolicWatts, airTempC, rh) => {
                const p_sat_air_kpa = 0.61121 * Math.exp((18.678 - airTempC / 234.5) * (airTempC / (257.14 + airTempC)));
                const p_vapor_air_kpa = rh * p_sat_air_kpa;
                const loss_sensible = 0.0014 * metabolicWatts * (34 - airTempC);
                const loss_latent = 0.0173 * metabolicWatts * Math.max(0, 6.266 - p_vapor_air_kpa);
                return loss_sensible + loss_latent;
            };

            const calculateDryHeatLoss = (coreT, airT, tissueIns, regionalCloValues, he) => {
                let totalDryLoss = 0;
                for (const region in bodyRegions) {
                    const regionalCloSI = (regionalCloValues[region] || 0) * CLO_TO_SI;
                    const I_ext_regional = regionalCloSI + (1 / he);
                    const totalInsulation_regional = tissueIns + I_ext_regional;
                    const regionArea = BSA * bodyRegions[region];

                    if (totalInsulation_regional > 0) {
                        const loss_regional = (coreT - airT) / totalInsulation_regional * regionArea;
                        totalDryLoss += loss_regional;
                    }
                }
                return totalDryLoss;
            };

            const calculateTissueResponse = (currentCoreTemp, setPointTemp) => {
                const I_TISSUE_BASAL_SI = 0.027, I_TISSUE_MAX_SI = 0.054, I_TISSUE_MIN_SI = 0.009;
                const tempDiff = currentCoreTemp - setPointTemp;
                let insulation = I_TISSUE_BASAL_SI;
                let constrictionFactor = 0;
                let dilationFactor = 0;

                if (tempDiff < -0.1) { // Vasoconstriction
                    constrictionFactor = Math.min(1, (-tempDiff - 0.1) / 0.8);
                    insulation = I_TISSUE_BASAL_SI + constrictionFactor * (I_TISSUE_MAX_SI - I_TISSUE_BASAL_SI);
                } else if (tempDiff > 0.1) { // Vasodilation
                    dilationFactor = Math.min(1, (tempDiff - 0.1) / 0.8);
                    insulation = I_TISSUE_BASAL_SI - dilationFactor * (I_TISSUE_BASAL_SI - I_TISSUE_MIN_SI);
                }
                return { insulation, constrictionFactor, dilationFactor };
            };

            const dataHistory = {
                time: [], coreTemp: [], skinTemp: [], heatProduction: [], solarGain: [],
                respiratoryLoss: [], dryLoss: [], sweatLoss: [], netRate: [],
                totalGain: [], totalLoss: [],
                shiveringIntensity: [], sweatingIntensity: [],
                vasoRegulationIntensity: []
            };

            let currentCoreTemp = T_CORE_INITIAL;
            let vasoActive = false, shiverActive = false, sweatActive = false, dilateActive = false;
            let finalState = {};
            const historyForAvg = {
                heatProduction: [],
                solarGain: [],
                respiratoryLoss: [],
                dryLoss: [],
                sweatLoss: [],
                netRate: [],
            };

            for (let t = 0; t <= durationMins; t++) {
                dataHistory.time.push(t);
                dataHistory.coreTemp.push(currentCoreTemp);

                // Calculate physiological regulation state
                const tissueResponse = calculateTissueResponse(currentCoreTemp, T_CORE_INITIAL);
                const tissueInsulationSI = tissueResponse.insulation;
                vasoActive = tissueInsulationSI > 0.028; // Slightly higher than basal value
                dilateActive = tissueInsulationSI < 0.026; // Slightly lower than basal value

                let shiveringMetIncrease = 0;
                let sweatingHeatLoss = 0;

                shiverActive = false;
                if (currentCoreTemp < SHIVERING_THRESHOLD) {
                    const tempDiff = SHIVERING_THRESHOLD - currentCoreTemp;
                    shiveringMetIncrease = Math.min(MAX_SHIVERING_MET_INCREASE, tempDiff * 4.0); // Enhanced response
                    shiverActive = true;
                }

                sweatActive = false;
                if (currentCoreTemp > SWEATING_THRESHOLD) {
                    const tempDiff = currentCoreTemp - SWEATING_THRESHOLD;
                    sweatingHeatLoss = Math.min(MAX_SWEATING_HEAT_LOSS_WATTS, tempDiff * 150); // Enhanced response
                    sweatActive = true;
                }

                // Calculate heat gains and losses
                const clothingInsulationSI = clothingClo * CLO_TO_SI;
                const currentMetValue = initialMetValue + shiveringMetIncrease;
                const heatProductionWatts = 58.2 * BSA * currentMetValue;

                const heatLossResp = calculateRespiratoryLoss(heatProductionWatts, tempC, humidityPercent / 100);
                const netMetabolicGain = heatProductionWatts - heatLossResp;

                const solarHeatGainWatts = solarRad * BSA * SOLAR_EFFECTIVE_FACTOR;

                const heatLossDry = calculateDryHeatLoss(currentCoreTemp, tempC, tissueInsulationSI, regionalClo, h_e);

                const netHeatRateWatts = netMetabolicGain + solarHeatGainWatts - heatLossDry - sweatingHeatLoss;

                // Calculate and store skin temp for chart
                let weightedSkinTempSum = 0;
                for (const region in bodyRegions) {
                    const regionalCloSI = (regionalClo[region] || 0) * CLO_TO_SI;
                    const I_ext_regional = regionalCloSI + (1 / h_e);
                    const totalInsulation_regional = tissueInsulationSI + I_ext_regional;
                    if (totalInsulation_regional > 0) {
                        const regionalSkinTemp = (currentCoreTemp * I_ext_regional + tempC * tissueInsulationSI) / totalInsulation_regional;
                        weightedSkinTempSum += regionalSkinTemp * bodyRegions[region];
                    } else {
                        weightedSkinTempSum += tempC * bodyRegions[region];
                    }
                }
                dataHistory.skinTemp.push(weightedSkinTempSum);

                // Store heat balance data
                historyForAvg.heatProduction.push(heatProductionWatts);
                historyForAvg.solarGain.push(solarHeatGainWatts);
                historyForAvg.respiratoryLoss.push(heatLossResp);
                historyForAvg.dryLoss.push(heatLossDry);
                historyForAvg.sweatLoss.push(sweatingHeatLoss);
                historyForAvg.netRate.push(netHeatRateWatts);

                dataHistory.heatProduction.push(heatProductionWatts);
                dataHistory.solarGain.push(solarHeatGainWatts);
                dataHistory.respiratoryLoss.push(heatLossResp);
                dataHistory.dryLoss.push(heatLossDry);
                dataHistory.sweatLoss.push(sweatingHeatLoss);
                dataHistory.netRate.push(netHeatRateWatts);
                dataHistory.totalGain.push(heatProductionWatts + solarHeatGainWatts);
                dataHistory.totalLoss.push(heatLossResp + heatLossDry + sweatingHeatLoss);
                dataHistory.shiveringIntensity.push((shiveringMetIncrease / MAX_SHIVERING_MET_INCREASE) * 100);
                dataHistory.sweatingIntensity.push((sweatingHeatLoss / MAX_SWEATING_HEAT_LOSS_WATTS) * 100);
                const vasoRegulationIntensity = (tissueResponse.dilationFactor - tissueResponse.constrictionFactor) * 100;
                dataHistory.vasoRegulationIntensity.push(vasoRegulationIntensity);

                // Update core body temperature
                const tempChangePerMinute = (netHeatRateWatts / bodyHeatCapacity) * 60;
                currentCoreTemp += tempChangePerMinute;

                if (t === durationMins) {
                    finalState = {
                        heatProductionWatts,
                        solarHeatGainWatts,
                        heatLossResp,
                        heatLossDry,
                        sweatingHeatLoss,
                        netHeatRateWatts,
                        shiveringIntensity: (shiveringMetIncrease / MAX_SHIVERING_MET_INCREASE) * 100,
                        sweatingIntensity: (sweatingHeatLoss / MAX_SWEATING_HEAT_LOSS_WATTS) * 100,
                        vasoRegulationIntensity: vasoRegulationIntensity,
                    };
                }
            }

            const finalTemp = currentCoreTemp;
            const finalSkinTemp = dataHistory.skinTemp[dataHistory.skinTemp.length - 1];

            const calculateAverage = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

            lastSimulationResults = {
                heatProductionWatts: calculateAverage(historyForAvg.heatProduction),
                solarHeatGainWatts: calculateAverage(historyForAvg.solarGain),
                heatLossResp: calculateAverage(historyForAvg.respiratoryLoss),
                heatLossDry: calculateAverage(historyForAvg.dryLoss),
                sweatingHeatLoss: calculateAverage(historyForAvg.sweatLoss),
                netRate: calculateAverage(historyForAvg.netRate),
                vasoActive: vasoActive,
                dilateActive: dilateActive,
                shiverActive: shiverActive,
                sweatActive: sweatActive,
            };

            const comfortScore = calculateComfortScore(finalTemp, coreTemp, finalSkinTemp, finalState, lastSimulationResults, lastSimulationResults);

            updatePhysiologyStatus(vasoActive, dilateActive, shiverActive, sweatActive);
            renderChart(dataHistory);
            updateSimulationSummary(finalTemp, coreTemp, finalSkinTemp, comfortScore);
            updateDetailedStatus(finalState, lastSimulationResults);
        }

        function calculateComfortScore(finalCoreTemp, baseCoreTemp, finalSkinTemp, finalState, averages, physiologicalState) {
            const tempDiff = finalCoreTemp - baseCoreTemp;
            const IDEAL_SKIN_TEMP = 33.5;
            const skinTempDiffFromIdeal = finalSkinTemp - IDEAL_SKIN_TEMP; // Deviation of final skin temperature from ideal.

            // Core temperature stability is paramount. Large deviations lead to significant discomfort.
            const p_core = Math.abs(tempDiff) * 40;

            // Skin temperature directly influences local and overall comfort perception.
            let p_skin = 0;
            if (skinTempDiffFromIdeal < 0) {
                // If skin temperature is below ideal (feeling cold)
                // Increased penalty for cold skin, as cold discomfort can be more acute and less tolerated.
                p_skin = Math.abs(skinTempDiffFromIdeal) * 12;
            } else {
                // If skin temperature is above ideal (feeling warm/hot)
                // Slightly lower penalty for warm skin compared to cold.
                p_skin = Math.abs(skinTempDiffFromIdeal) * 10;
            }

            // Shivering and Sweating Intensity Penalty
            const p_response_shiver_sweat = (finalState.shiveringIntensity + finalState.sweatingIntensity) * 0.4;

            // Vasoregulation (Vasoconstriction/Vasodilation) Penalty
            let p_vasoregulation = 0;
            if (physiologicalState.vasoActive) {
                p_vasoregulation = Math.min(25, (baseCoreTemp - finalCoreTemp) * 50);
            } else if (physiologicalState.dilateActive) {
                p_vasoregulation = Math.min(25, (finalCoreTemp - baseCoreTemp) * 40);
            }

            // Net Heat Rate Penalty
            const p_net = Math.abs(averages.netRate) * 0.2;

            let score = 100 - p_core - p_skin - p_response_shiver_sweat - p_net - p_vasoregulation;

            return Math.max(0, Math.min(100, score));
        }

        function updatePhysiologyStatus(vaso, dilate, shiver, sweat) {
            const t = translations[currentLang];
            const statuses = [];
            if (vaso) statuses.push(t.vasoconstriction);

            if (shiver) statuses.push(t.shivering);
            if (sweat) statuses.push(t.sweating);

            if (statuses.length > 0) {
                dom.physiologyStatusText.textContent = statuses.join(' | ');
                dom.physiologyStatusText.className = 'text-lg font-semibold text-yellow-400';
            } else {
                dom.physiologyStatusText.textContent = t.status_stable;
                dom.physiologyStatusText.className = 'text-lg font-semibold text-green-400';
            }
        }

            dom.detailSolar.textContent = `${finalState.solarHeatGainWatts.toFixed(1)} / ${averages.solarHeatGainWatts.toFixed(1)} W`;
            dom.detailRespiratory.textContent = `${finalState.heatLossResp.toFixed(1)} / ${averages.heatLossResp.toFixed(1)} W`;
            dom.detailDry.textContent = `${finalState.heatLossDry.toFixed(1)} / ${averages.heatLossDry.toFixed(1)} W`;
            dom.detailSweat.textContent = `${finalState.sweatingHeatLoss.toFixed(1)} / ${averages.sweatingHeatLoss.toFixed(1)} W`;
            dom.detailNet.textContent = `${finalState.netHeatRateWatts.toFixed(1)} / ${averages.netRate.toFixed(1)} W`;
            dom.detailShivering.textContent = `${finalState.shiveringIntensity.toFixed(1)} %`;

        }

                        let hoveredDatasetIndex = -1;

                        if (chartElements.length > 0) {
                            let closestElement = null;
                            let minDistance = Infinity;

                            for (const element of chartElements) {
                                const { x, y } = element.element.getCenterPoint();
                                const distance = Math.sqrt(Math.pow(event.x - x, 2) + Math.pow(event.y - y, 2));
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    closestElement = element;
                                }
                            }

                            if (closestElement && minDistance < 15) {
                                const dataset = chart.data.datasets[closestElement.datasetIndex];
                                if (!dataset.hidden) {
                                    hoveredDatasetIndex = closestElement.datasetIndex;
                                }
                            }

                        if (hoveredDatasetIndex !== -1) {

                            // The 'event' object from onHover is a ChartEvent which wraps the native DOM event.
                            // We use the native event's clientX/Y to get viewport-relative coordinates,
                            // then subtract the container's offset to get the position inside the container.
                            let x = event.native.clientX - chartRect.left + 10;
                            let y = event.native.clientY - chartRect.top + 10;

                            dom.hoverLabel.style.left = `${x}px`;
                            dom.hoverLabel.style.top = `${y}px`;
                            dom.hoverLabel.classList.remove('hidden');
                        }

                                    if (label) { label += ': '; }
                                    if (context.parsed.y !== null) { label += context.parsed.y.toFixed(2); }

                    const isVisible = checkbox.checked;
                    const dataset = simulationChartInstance.data.datasets[index];
                    dataset.hidden = !isVisible;

                    let y2Visible = false;
                    simulationChartInstance.data.datasets.forEach(ds => {
                        if (!ds.hidden) {
                            if (ds.yAxisID === 'y1') y1Visible = true;

                    simulationChartInstance.options.scales.y1.display = y1Visible;
                    simulationChartInstance.options.scales.y2.display = y2Visible;

                    simulationChartInstance.update();

                    // Persist the state
                    if (dataset.key) {

                const label = document.createElement('label');
                label.htmlFor = `chart-toggle-${index}`;
                label.textContent = labelText;
                label.className = 'ml-2 text-sm font-medium';
                label.style.color = color;

                wrapper.appendChild(checkbox);
                wrapper.appendChild(label);
                controlsContainer.appendChild(wrapper);
            });
        }

        function updateSimulationSummary(finalTemp, coreTemp, finalSkinTemp, comfortScore) {
            const t = translations[currentLang];
            let summaryText, bgColor, textColor;
            const finalTempStr = finalTemp.toFixed(2);
            const tempDiff = finalTemp - coreTemp;

            if (finalTemp < 35.0) {
                summaryText = t.summary_hypothermia; bgColor = 'bg-red-800'; textColor = 'text-white';
            } else if (tempDiff < -0.8) {
                summaryText = t.summary_very_cold; bgColor = 'bg-red-600'; textColor = 'text-white';
            } else if (tempDiff < -0.4) {
                summaryText = t.summary_cold; bgColor = 'bg-blue-600'; textColor = 'text-white';
            } else if (tempDiff < -0.1) {
                summaryText = t.summary_cool; bgColor = 'bg-cyan-500'; textColor = 'text-white';
            } else if (tempDiff <= 0.2) {
                summaryText = t.summary_comfortable; bgColor = 'bg-green-600'; textColor = 'text-white';
            } else if (tempDiff <= 0.5) {
                summaryText = t.summary_warm; bgColor = 'bg-yellow-500'; textColor = 'text-black';
            } else if (finalTemp <= 38.5) {
                summaryText = t.summary_hot; bgColor = 'bg-orange-500'; textColor = 'text-white';
            } else {
                summaryText = t.summary_overheating; bgColor = 'bg-red-600'; textColor = 'text-white';
            }

            const skinTempText = `<div class="text-base font-medium mt-1 text-orange-200">${t.final_skin_temp}: ${finalSkinTemp.toFixed(2)}°C</div>`;
            dom.simSummary.innerHTML = `<div><span class="text-4xl">${finalTempStr}°C</span><span class="text-lg ml-3 font-medium">${summaryText}</span></div>${skinTempText}`;
            dom.simSummary.className = `font-bold p-3 rounded-lg h-24 flex flex-col items-center justify-center text-center transition-all duration-500 ${bgColor} ${textColor}`;

            // Update comfort score display
            if (dom.comfortScore) {
                let comfortColor = 'text-green-300';
                let comfortKey = 'comfort_ideal';
                if (comfortScore < 80) {
                    comfortColor = 'text-yellow-300';
                    comfortKey = 'comfort_acceptable';
                }
                if (comfortScore < 60) {
                    comfortColor = 'text-orange-300';
                    comfortKey = 'comfort_uncomfortable';
                }
                if (comfortScore < 40) {
                    comfortColor = 'text-red-400';
                    comfortKey = 'comfort_distress';
                }
                lastComfortKey = comfortKey;
                lastComfortText = t[comfortKey];
                dom.comfortScore.innerHTML = `<span class="${comfortColor}">${comfortScore.toFixed(0)} / 100</span> <span class="text-base align-bottom ml-1 ${comfortColor}">(${lastComfortText})</span>`;
            }
        }

        function handleAddClothing() {
            const key = dom.clothingItem.value;
            if (!key) return;
            const modifier = parseFloat(dom.thicknessModifier.value);
            // Store the item key along with its data for more accurate JSON output
            const item = {
                itemId: key,
                modifier: modifier,
                ...JSON.parse(JSON.stringify(clothingData[key]))
            };
            currentOutfit.push(item);
            updateOutfitUI();
        }

        function handleRemoveClothing(event) {
            currentOutfit.splice(parseInt(event.target.dataset.index, 10), 1);
            updateOutfitUI();
        }

        function getFullReportData() {
            const t_en = translations['en'];

            const getModifierTextEn = (modifierValue) => {
                const epsilon = 0.001;
                for (const key in thicknessModifiers) {
                    if (Math.abs(thicknessModifiers[key].value - modifierValue) < epsilon) {
                        return t_en[thicknessModifiers[key].key];
                    }
                }
                return t_en.mod_normal;
            };

            const getPhysiologyResponseEn = () => {
                const statuses = [];
                if (lastSimulationResults.vasoActive) statuses.push(t_en.vasoconstriction);
                if (lastSimulationResults.dilateActive) statuses.push(t_en.vasodilation);
                if (lastSimulationResults.shiverActive) statuses.push(t_en.shivering);
                if (lastSimulationResults.sweatActive) statuses.push(t_en.sweating);
                return statuses.length > 0 ? statuses.join(' | ') : t_en.status_stable;
            };

            const inputs = {
                gender: dom.gender.value,
                height_cm: parseFloat(dom.height.value),
                weight_kg: parseFloat(dom.weight.value),
                age_years: parseInt(dom.age.value),
                base_core_temp_c: parseFloat(dom.coreTemp.value),
                air_temp_c: parseFloat(dom.temperature.value),
                wind_speed_kmh: parseFloat(dom.wind.value),
                relative_humidity_percent: parseFloat(dom.humidity.value),
                solar_radiation_wm2: parseFloat(dom.solarLevel.value),
                activity_met: parseFloat(dom.activity.value),
                duration_min: parseInt(dom.duration.value),
                outfit: currentOutfit.map(item => ({
                    name_en: item.name_en,
                    regionalClo: item.regionalClo,
                    thickness_modifier: item.modifier,
                    thickness_modifier_text: getModifierTextEn(item.modifier),
                })),
            };

            const outputs = {
                total_clo_sum: parseFloat(dom.totalClo.textContent),
                effective_clo_weighted: parseFloat(dom.effectiveClo.textContent),
                final_core_temp_c: parseFloat(dom.simSummary.querySelector('span').textContent),
                final_skin_temp_c: parseFloat(dom.simSummary.querySelector('.text-orange-200').textContent.split(': ')[1]),
                physiological_response: getPhysiologyResponseEn(),
                overall_comfort_score: parseFloat(dom.comfortScore.textContent.split(' / ')[0]),
                overall_comfort_text: t_en[lastComfortKey] || '',
                detailed_heat_balance_watts: {
                    metabolic_gain: parseFloat(dom.detailMetabolic.textContent.split(' / ')[0]),
                    solar_gain: parseFloat(dom.detailSolar.textContent.split(' / ')[0]),
                    respiratory_loss: parseFloat(dom.detailRespiratory.textContent.split(' / ')[0]),
                    dry_skin_loss: parseFloat(dom.detailDry.textContent.split(' / ')[0]),
                    sweat_evaporation_loss: parseFloat(dom.detailSweat.textContent.split(' / ')[0]),
                    final_net_rate: parseFloat(dom.detailNet.textContent.split(' / ')[0]),
                },
                average_heat_balance_watts: {
                    metabolic_gain: lastSimulationResults.heatProductionWatts,
                    solar_gain: lastSimulationResults.solarHeatGainWatts,
                    respiratory_loss: lastSimulationResults.heatLossResp,
                    dry_skin_loss: lastSimulationResults.heatLossDry,
                    sweat_evaporation_loss: lastSimulationResults.sweatingHeatLoss,
                    net_rate: lastSimulationResults.netRate,
                },
                physiological_response_intensity_percent: {
                    shivering: parseFloat(dom.detailShivering.textContent),
                    sweating: parseFloat(dom.detailSweating.textContent),
                    vasoregulation: parseFloat(dom.detailVasoregulation.textContent),
                }
            };
            return { inputs, results: outputs };
        }

        function handleExportCsv() {
            if (!lastSimulationResults) {
                alert(currentLang === 'en' ? 'No simulation data to export.' : '没有可导出的仿真数据。');
                return;
            }

            const fullReportData = getFullReportData();
            let csvRows = [];

            csvRows.push('"Inputs"');
            csvRows.push('"Parameter","Value"');
            Object.entries(fullReportData.inputs).forEach(([key, value]) => {
                if (key === 'outfit') {
                    csvRows.push(`"outfit",""`);
                    value.forEach((item, index) => {
                        csvRows.push(`"  ${index + 1}: name_en","${item.name_en}"`);
                        csvRows.push(`"  ${index + 1}: thickness_modifier","${item.thickness_modifier}"`);
                        csvRows.push(`"  ${index + 1}: thickness_modifier_text","${item.thickness_modifier_text}"`);
                        Object.entries(item.regionalClo).forEach(([region, clo]) => {
                            csvRows.push(`"    - ${region} Clo","${clo}"`);
                        });
                    });
                } else {
                    csvRows.push(`"${key}","${value}"`);
                }
            });
            csvRows.push('');

            csvRows.push('"Results"');
            csvRows.push('"Result","Value"');
            const flattenResults = (obj, prefix = '', rows = []) => {
                Object.entries(obj).forEach(([key, value]) => {
                    const newKey = prefix ? `${prefix} - ${key}`.replace(/_/g, ' ') : key.replace(/_/g, ' ');
                    if (typeof value === 'object' && value !== null) {
                        flattenResults(value, newKey, rows);
                    } else {
                        rows.push(`"${newKey}","${value}"`);
                    }
                });
                return rows;
            }
            csvRows.push(...flattenResults(fullReportData.results));
            csvRows.push('');
            csvRows.push('');


            if (simulationChartInstance) {
                csvRows.push('"Time Series Data"');
                const t_en = translations['en'];
                const { labels, datasets } = simulationChartInstance.data;

                const headers = [`"${t_en.time_axis_label}"`, ...datasets.map(ds => `"${t_en[ds.key] || ds.label}"`)];
                csvRows.push(headers.join(','));

                const numPoints = labels.length;
                if (numPoints > 0) {
                    for (let i = 0; i < numPoints; i++) {
                        const row = [labels[i]];
                        datasets.forEach(ds => {
                            const value = ds.data[i];
                            row.push(typeof value === 'number' ? value.toFixed(4) : '');
                        });
                        csvRows.push(row.join(','));
                    }
                }
            }


            const csvString = csvRows.join('\n');
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvString], { type: 'text/csv;charset=utf-8;' });

            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `thermal_simulation_report_${new Date().toISOString().replace(/:/g, '-')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function handleImportCsv() {
            dom.csvFileInput.click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const contents = e.target.result;
                try {
                    parseAndApplyCsv(contents);
                    triggerSimulation();
                    // Reset file input to allow re-selection of the same file
                    dom.csvFileInput.value = '';
                } catch (error) {
                    console.error("Failed to parse or apply CSV:", error);
                    alert(currentLang === 'en' ? `Error importing CSV: ${error.message}` : `导入CSV出错: ${error.message}`);
                    dom.csvFileInput.value = '';
                }
            };
            reader.readAsText(file);
        }

        function parseAndApplyCsv(csvString) {
            const lines = csvString.split('\n').map(l => l.trim().replace(/"/g, ''));
            const inputs = {};
            let isInputsSection = false;
            let currentClothingItem = null;
            let newOutfit = [];

            // Reverse lookup for clothing items by English name
            const clothingReverseLookup = {};
            for (const key in clothingData) {
                clothingReverseLookup[clothingData[key].name_en.toLowerCase()] = key;
            }

            for (const line of lines) {
                if (line === 'Inputs') {
                    isInputsSection = true;
                    continue;
                }
                if (line === 'Results' || (isInputsSection && line === '')) {
                    isInputsSection = false;
                    break;
                }

                if (isInputsSection && line !== 'Parameter,Value') {
                    const parts = line.split(',');
                    const key = parts[0];
                    const value = parts.slice(1).join(',');

                    if (key.startsWith('  ') && key.includes(':')) {
                        // outfit item property
                        const propKey = key.trim().split(': ')[1];
                        if (propKey === 'name_en') {
                            if (currentClothingItem) newOutfit.push(currentClothingItem); // save previous item
                            const itemId = clothingReverseLookup[value.toLowerCase()];
                            if (!itemId) throw new Error(`Clothing item "${value}" not found in presets.`);
                            currentClothingItem = {
                                itemId: itemId,
                                ...JSON.parse(JSON.stringify(clothingData[itemId]))
                            };
                        } else if (propKey === 'thickness_modifier' && currentClothingItem) {
                            currentClothingItem.modifier = parseFloat(value);
                        }
                    } else if (!key.startsWith(' ') && key !== 'outfit') {
                        // main input parameter
                        inputs[key] = value;
                    }
                }
            }
            if (currentClothingItem) newOutfit.push(currentClothingItem);

            // Apply parsed values to UI
            dom.gender.value = inputs.gender || 'female';
            dom.height.value = inputs.height_cm || '165';
            dom.weight.value = inputs.weight_kg || '50';
            dom.age.value = inputs.age_years || '17';
            dom.coreTemp.value = inputs.base_core_temp_c || '36.6';
            dom.temperature.value = inputs.air_temp_c || '5';
            dom.wind.value = inputs.wind_speed_kmh || '15';
            dom.humidity.value = inputs.relative_humidity_percent || '50';
            dom.solarLevel.value = inputs.solar_radiation_wm2 || '400';
            dom.activity.value = inputs.activity_met || '2.6';
            dom.duration.value = inputs.duration_min || '30';

            currentOutfit = newOutfit;
            updateOutfitUI();
        }

        function triggerSimulation() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(runSimulation, 250);
        }

        function openEditModal(index) {
            currentEditIndex = index;
            const item = currentOutfit[index];
            if (!item) return;

            const t = translations[currentLang];
            const name = currentLang === 'en' ? item.name_en : item.name;

            dom.editModalItemName.textContent = name;
            dom.editModalBody.innerHTML = '';

            const regionOrder = ['head', 'torso', 'arms', 'hands', 'legs', 'feet'];

            regionOrder.forEach(regionKey => {
                const value = item.regionalClo[regionKey] || 0;
                const regionName = t[`region_${regionKey}`] || regionKey;

                const inputGroup = document.createElement('div');
                inputGroup.className = 'grid grid-cols-2 items-center gap-4';
                inputGroup.innerHTML = `
                    <label for="edit-clo-${regionKey}" class="text-sm font-medium text-gray-300 justify-self-start">${regionName}</label>
                    <input type="number" id="edit-clo-${regionKey}" value="${value.toFixed(3)}" step="0.01" min="0" class="input-field">
                `;
                dom.editModalBody.appendChild(inputGroup);
            });

            const thicknessDiv = document.createElement('div');
            thicknessDiv.className = 'grid grid-cols-2 items-center gap-4 mt-4 pt-4 border-t border-gray-700';
            thicknessDiv.innerHTML = `<label for="edit-thickness-modifier" class="text-sm font-medium text-gray-300 justify-self-start">${t.thickness_modifier}</label>`;
            const select = document.createElement('select');
            select.id = 'edit-thickness-modifier';
            select.className = 'input-field';

            for (const key in thicknessModifiers) {
                const option = document.createElement('option');
                option.value = thicknessModifiers[key].value;
                option.textContent = t[thicknessModifiers[key].key];
                if (Math.abs(thicknessModifiers[key].value - (item.modifier || 1.0)) < 0.001) {
                    option.selected = true;
                }
                select.appendChild(option);
            }
            thicknessDiv.appendChild(select);
            dom.editModalBody.appendChild(thicknessDiv);

            dom.editModal.classList.remove('hidden');
            setTimeout(() => {
                dom.editModal.querySelector('.transform').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeEditModal() {
            dom.editModal.querySelector('.transform').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                dom.editModal.classList.add('hidden');
                currentEditIndex = -1;
            }, 300);
        }

        function handleSaveEdit() {
            if (currentEditIndex === -1) return;

            const item = currentOutfit[currentEditIndex];
            const regionOrder = ['head', 'torso', 'arms', 'hands', 'legs', 'feet'];

            regionOrder.forEach(regionKey => {
                const input = document.getElementById(`edit-clo-${regionKey}`);
                const value = parseFloat(input.value);
                if (!isNaN(value) && value > 0) {
                    item.regionalClo[regionKey] = value;
                } else {
                    delete item.regionalClo[regionKey];
                }
            });

            const thicknessSelect = document.getElementById('edit-thickness-modifier');
            if (thicknessSelect) {
                item.modifier = parseFloat(thicknessSelect.value);
            }

            closeEditModal();
            updateOutfitUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            dom = {
                gender: document.getElementById('gender'), height: document.getElementById('height'), weight: document.getElementById('weight'), age: document.getElementById('age'), temperature: document.getElementById('temperature'), wind: document.getElementById('wind'), humidity: document.getElementById('humidity'), solarLevel: document.getElementById('solar-level'), activity: document.getElementById('activity'), duration: document.getElementById('duration'), clothingItem: document.getElementById('clothing-item'), addBtn: document.getElementById('add-clothing-btn'), outfitList: document.getElementById('current-outfit-list'), emptyMsg: document.getElementById('empty-outfit-msg'), totalClo: document.getElementById('total-clo'), simContainer: document.getElementById('simulation-results-container'),
                chartContainer: document.getElementById('chart-container'),
                chart: document.getElementById('simulation-chart'),
                hoverLabel: document.getElementById('hover-label'),
                simSummary: document.getElementById('simulation-summary'),
                physiologyStatusText: document.getElementById('physiology-status-text'),
                coreTemp: document.getElementById('core-temp'),
                detailMetabolic: document.getElementById('detail-metabolic'), detailSolar: document.getElementById('detail-solar'), detailRespiratory: document.getElementById('detail-respiratory'), detailDry: document.getElementById('detail-dry'), detailSweat: document.getElementById('detail-sweat'), detailNet: document.getElementById('detail-net'), detailShivering: document.getElementById('detail-shivering'), detailSweating: document.getElementById('detail-sweating'),
                detailVasoregulation: document.getElementById('detail-vasoregulation'),
                effectiveClo: document.getElementById('effective-clo'),
                thicknessModifier: document.getElementById('thickness-modifier'),
                copyJsonBtn: document.getElementById('copy-json-btn'),
                comfortScore: document.getElementById('comfort-score'),
                editModal: document.getElementById('edit-modal'),
                editModalCloseBtn: document.getElementById('edit-modal-close-btn'),
                editModalItemName: document.getElementById('edit-modal-item-name'),
                editModalBody: document.getElementById('edit-modal-body'),
                editModalCancel: document.getElementById('edit-modal-cancel'),
                editModalSave: document.getElementById('edit-modal-save'),
                langSwitcher: document.getElementById('lang-switcher'),
                exportCsvBtn: document.getElementById('export-csv-btn'),
                importCsvBtn: document.getElementById('import-csv-btn'),
                csvFileInput: document.getElementById('csv-file-input'),
            };

            setLanguage(navigator.language || navigator.userLanguage);

            dom.langSwitcher.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'zh' : 'en';
                setLanguage(newLang);
            });

            dom.addBtn.addEventListener('click', handleAddClothing);
            dom.exportCsvBtn.addEventListener('click', handleExportCsv);
            dom.editModalSave.addEventListener('click', handleSaveEdit);
            dom.editModalCancel.addEventListener('click', closeEditModal);
            dom.editModalCloseBtn.addEventListener('click', closeEditModal);
            dom.importCsvBtn.addEventListener('click', handleImportCsv);
            dom.csvFileInput.addEventListener('change', handleFileSelect);
            Object.values(dom).forEach(element => {
                if (element && (element.tagName === 'INPUT' || element.tagName === 'SELECT')) {
                    element.addEventListener('input', triggerSimulation);
                    element.addEventListener('change', triggerSimulation);
                }
            });
            // Initial Run is triggered by setLanguage
        });
    </script>

    <div id="edit-modal"
        class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50 transition-opacity duration-300">
        <div class="card p-6 rounded-xl w-full max-w-md m-4 transform transition-all duration-300 scale-95 opacity-0">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold text-white" data-t="edit_clothing_preset"></h2>
                <button id="edit-modal-close-btn"
                    class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <p id="edit-modal-item-name" class="text-violet-300 font-semibold mb-4"></p>
            <div id="edit-modal-body" class="space-y-3">
            </div>
            <div class="mt-6 flex justify-end space-x-4">
                <button id="edit-modal-cancel" class="btn-secondary" data-t="cancel_btn"></button>
                <button id="edit-modal-save" class="btn-secondary bg-violet-600 hover:bg-violet-700"
                    data-t="save_btn"></button>
            </div>
        </div>
    </div>
</body>
