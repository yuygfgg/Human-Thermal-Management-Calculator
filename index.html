        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const contents = e.target.result;
                try {
                    parseAndApplyCsv(contents);
                    saveInputsToSessionStorage();
                    triggerSimulation();
                    // Reset file input to allow re-selection of the same file
                    dom.csvFileInput.value = '';
                } catch (error) {
                    console.error("Failed to parse or apply CSV:", error);
                    alert(currentLang === 'en' ? `Error importing CSV: ${error.message}` : `导入CSV出错: ${error.message}`);
                    dom.csvFileInput.value = '';
                }
            };
            reader.readAsText(file);
        }

        function parseAndApplyCsv(csvString) {
            const lines = csvString.split('\n').map(l => l.trim().replace(/"/g, ''));
            const inputs = {};
            let isInputsSection = false;
            let currentClothingItem = null;
            let newOutfit = [];

            // Reverse lookup for clothing items by English name
            const clothingReverseLookup = {};
            for (const key in clothingData) {
                clothingReverseLookup[clothingData[key].name_en.toLowerCase()] = key;
            }

            for (const line of lines) {
                if (line === 'Inputs') {
                    isInputsSection = true;
                    continue;
                }
                if (line === 'Results' || (isInputsSection && line === '')) {
                    isInputsSection = false;
                    continue;
                }

                if (isInputsSection && line !== 'Parameter,Value') {
                    const parts = line.split(',');
                    const key = parts[0];
                    const value = parts.slice(1).join(',');

                    if (key.startsWith('  ') && key.includes(':')) {
                        // outfit item property
                        const propKey = key.trim().split(': ')[1];
                        if (propKey === 'name_en') {
                            if (currentClothingItem) newOutfit.push(currentClothingItem); // save previous item
                            const itemId = clothingReverseLookup[value.toLowerCase()];
                            if (!itemId) throw new Error(`Clothing item "${value}" not found in presets.`);
                            currentClothingItem = {
                                itemId: itemId,
                                ...JSON.parse(JSON.stringify(clothingData[itemId]))
                            };
                        } else if (propKey === 'thickness_modifier' && currentClothingItem) {
                            currentClothingItem.modifier = parseFloat(value);
                        }
                    } else if (!key.startsWith(' ') && key !== 'outfit') {
                        // main input parameter
                        inputs[key] = value;
                    }
                }
            }
            if (currentClothingItem) newOutfit.push(currentClothingItem);

            // Apply parsed values to UI
            dom.gender.value = inputs.gender || 'female';
            dom.height.value = inputs.height_cm || '165';
            dom.weight.value = inputs.weight_kg || '50';
            dom.age.value = inputs.age_years || '17';
            dom.coreTemp.value = inputs.base_core_temp_c || '36.6';
            dom.temperature.value = inputs.air_temp_c || '5';
            dom.wind.value = inputs.wind_speed_kmh || '15';
            dom.humidity.value = inputs.relative_humidity_percent || '50';
            dom.mediumK.value = inputs.medium_thermal_conductivity_w_mk || '0.026';
            dom.solarLevel.value = inputs.solar_radiation_wm2 || '400';
            dom.activity.value = inputs.activity_met || '2.6';
            dom.duration.value = inputs.duration_min || '30';

            currentOutfit = newOutfit;
            updateOutfitUI();

            // Optional: restore raw JOS-3 results from the exported CSV for offline viewing.
            // This does not block a new simulation from running; it just provides data immediately.
            const parseJos3FromCsv = (sanitizedLines) => {
                const start = sanitizedLines.findIndex(l => l === 'JOS3 Raw Data');
                if (start < 0) return null;

                let i = start + 1;
                while (i < sanitizedLines.length && sanitizedLines[i] === '') i++;

                let version = null;
                if (i < sanitizedLines.length && sanitizedLines[i].startsWith('jos3_version,')) {
                    version = sanitizedLines[i].split(',').slice(1).join(',').trim() || null;
                    i++;
                }
                while (i < sanitizedLines.length && sanitizedLines[i] === '') i++;

                const header = sanitizedLines[i];
                if (!header) return null;
                const keys = header.split(',').map(s => s.trim()).filter(Boolean);
                if (!keys.length) return null;

                const out = {};
                keys.forEach(k => { out[k] = []; });

                const sectionStops = new Set(['Inputs', 'Results', 'Time Series Data', 'JOS3 Raw Data']);
                const toNumOrNull = (s) => {
                    const t = (s || '').trim();
                    if (!t) return null;
                    const n = Number(t);
                    return Number.isFinite(n) ? n : null;
                };

                for (i = i + 1; i < sanitizedLines.length; i++) {
                    const line = sanitizedLines[i];
                    if (!line) break;
                    if (sectionStops.has(line)) break;
                    const parts = line.split(',');
                    for (let c = 0; c < keys.length; c++) {
                        out[keys[c]].push(toNumOrNull(parts[c]));
                    }
                }
                return { version, results: out };
            };

            const importedJos3 = parseJos3FromCsv(lines);
            if (importedJos3?.results && Object.keys(importedJos3.results).length) {
                if (!lastSimulationResults || typeof lastSimulationResults !== 'object') lastSimulationResults = {};
                if (!lastSimulationResults.jos3 || typeof lastSimulationResults.jos3 !== 'object') lastSimulationResults.jos3 = {};
                lastSimulationResults.jos3.results = importedJos3.results;
                if (importedJos3.version) lastSimulationResults.jos3.version = importedJos3.version;
                updateJos3Panel();
            }
        }

        function triggerSimulation() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(runSimulation, 250);
        }

        function openEditModal(index) {
            currentEditIndex = index;
            const item = currentOutfit[index];
            if (!item) return;

            const t = translations[currentLang];
            const name = currentLang === 'en' ? item.name_en : item.name;

            dom.editModalItemName.textContent = name;
            dom.editModalBody.innerHTML = '';

            clothingSegments.forEach(seg => {
                const segKey = seg.key;
                const value = (item.segClo && item.segClo[segKey]) ? item.segClo[segKey] : 0;
                const segName = currentLang === 'en' ? seg.en : seg.zh;

                const inputGroup = document.createElement('div');
                inputGroup.className = 'grid grid-cols-2 items-center gap-4';
                inputGroup.innerHTML = `
                    <label for="edit-clo-${segKey}" class="text-sm font-medium text-gray-300 justify-self-start">${segName}</label>
                    <input type="number" id="edit-clo-${segKey}" value="${value.toFixed(3)}" step="0.01" min="0" class="input-field">
                `;
                dom.editModalBody.appendChild(inputGroup);
            });

            const respModifierDiv = document.createElement('div');
            respModifierDiv.className = 'grid grid-cols-2 items-center gap-4 mt-2 pt-2 border-t border-gray-700';
            const respModifierValue = (item.respiratoryModifier || 0) * 100;
            respModifierDiv.innerHTML = `
                <label for="edit-respiratory-modifier" class="text-sm font-medium text-gray-300 justify-self-start">${t.respiratory_reduction}</label>
                <input type="number" id="edit-respiratory-modifier" value="${respModifierValue.toFixed(0)}" step="1" min="0" max="100" class="input-field">
            `;
            dom.editModalBody.appendChild(respModifierDiv);

            const thicknessDiv = document.createElement('div');
            thicknessDiv.className = 'grid grid-cols-2 items-center gap-4 mt-2 pt-2 border-t border-gray-700';
            thicknessDiv.innerHTML = `<label for="edit-thickness-modifier" class="text-sm font-medium text-gray-300 justify-self-start">${t.thickness_modifier}</label>`;
            const select = document.createElement('select');
            select.id = 'edit-thickness-modifier';
            select.className = 'input-field';

            for (const key in thicknessModifiers) {
                const option = document.createElement('option');
                option.value = thicknessModifiers[key].value;
                option.textContent = t[thicknessModifiers[key].key];
                if (Math.abs(thicknessModifiers[key].value - (item.modifier || 1.0)) < 0.001) {
                    option.selected = true;
                }
                select.appendChild(option);
            }
            thicknessDiv.appendChild(select);
            dom.editModalBody.appendChild(thicknessDiv);

            dom.editModal.classList.remove('hidden');
            setTimeout(() => {
                dom.editModal.querySelector('.transform').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeEditModal() {
            dom.editModal.querySelector('.transform').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                dom.editModal.classList.add('hidden');
                currentEditIndex = -1;
            }, 300);
        }

        function handleSaveEdit() {
            if (currentEditIndex === -1) return;

            const item = currentOutfit[currentEditIndex];
            if (!item.segClo || typeof item.segClo !== 'object') item.segClo = {};

            clothingSegmentKeys.forEach(segKey => {
                const input = document.getElementById(`edit-clo-${segKey}`);
                if (!input) return;
                const value = parseFloat(input.value);
                if (!isNaN(value) && value > 0) {
                    item.segClo[segKey] = value;
                } else {
                    delete item.segClo[segKey];
                }
            });

            const respInput = document.getElementById('edit-respiratory-modifier');
            if (respInput) {
                const respValue = parseFloat(respInput.value);
                if (!isNaN(respValue) && respValue > 0) {
                    item.respiratoryModifier = respValue / 100.0;
                } else {
                    delete item.respiratoryModifier;
                }
            }

            const thicknessSelect = document.getElementById('edit-thickness-modifier');
            if (thicknessSelect) {
                item.modifier = parseFloat(thicknessSelect.value);
            }

            saveInputsToSessionStorage();
            closeEditModal();
            updateOutfitUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            dom = {
                gender: document.getElementById('gender'), height: document.getElementById('height'), weight: document.getElementById('weight'), age: document.getElementById('age'), temperature: document.getElementById('temperature'), wind: document.getElementById('wind'), humidity: document.getElementById('humidity'), mediumK: document.getElementById('medium-k'), solarLevel: document.getElementById('solar-level'), activity: document.getElementById('activity'), duration: document.getElementById('duration'), clothingItem: document.getElementById('clothing-item'), addBtn: document.getElementById('add-clothing-btn'), outfitList: document.getElementById('current-outfit-list'), emptyMsg: document.getElementById('empty-outfit-msg'), totalClo: document.getElementById('total-clo'), simContainer: document.getElementById('simulation-results-container'),
                chartContainer: document.getElementById('chart-container'),
                chart: document.getElementById('simulation-chart'),
                hoverLabel: document.getElementById('hover-label'),
                simSummary: document.getElementById('simulation-summary'),
                physiologyStatusText: document.getElementById('physiology-status-text'),
                coreTemp: document.getElementById('core-temp'),
                detailMetabolic: document.getElementById('detail-metabolic'), detailSolar: document.getElementById('detail-solar'), detailRespiratory: document.getElementById('detail-respiratory'), detailDry: document.getElementById('detail-dry'), detailSweat: document.getElementById('detail-sweat'), detailNet: document.getElementById('detail-net'), detailShivering: document.getElementById('detail-shivering'), detailSweating: document.getElementById('detail-sweating'),
                detailVasoconstriction: document.getElementById('detail-vasoconstriction'),
                detailVasodilation: document.getElementById('detail-vasodilation'),
                effectiveClo: document.getElementById('effective-clo'),
                thicknessModifier: document.getElementById('thickness-modifier'),
                copyJsonBtn: document.getElementById('copy-json-btn'),
                comfortScore: document.getElementById('comfort-score'),
                clearOutfitBtn: document.getElementById('clear-outfit-btn'),
                editModal: document.getElementById('edit-modal'),
                editModalCloseBtn: document.getElementById('edit-modal-close-btn'),
                editModalItemName: document.getElementById('edit-modal-item-name'),
                editModalBody: document.getElementById('edit-modal-body'),
                editModalCancel: document.getElementById('edit-modal-cancel'),
                editModalSave: document.getElementById('edit-modal-save'),
                langSwitcher: document.getElementById('lang-switcher'),
                exportCsvBtn: document.getElementById('export-csv-btn'),
                importCsvBtn: document.getElementById('import-csv-btn'),
                csvFileInput: document.getElementById('csv-file-input'),
                themeLightIcon: document.getElementById('theme-light-icon'),
                themeDarkIcon: document.getElementById('theme-dark-icon'),
                themeToggle: document.getElementById('theme-toggle'),
                jos3Panel: document.getElementById('jos3-panel'),
                jos3SkinTable: document.getElementById('jos3-skin-table'),
                jos3CoreTable: document.getElementById('jos3-core-table'),
                jos3KeyFilter: document.getElementById('jos3-key-filter'),
                jos3RawKey: document.getElementById('jos3-raw-key'),
                jos3RawMode: document.getElementById('jos3-raw-mode'),
                jos3Segment: document.getElementById('jos3-segment'),
                jos3RawMeta: document.getElementById('jos3-raw-meta'),
                jos3Chart: document.getElementById('jos3-chart'),
            };

            const savedState = restoreInputsFromSessionStorage();

            // Initialize theme
            let initialTheme = savedState?.theme || detectSystemTheme();
            if (savedState?.theme) {
                userHasSetTheme = true;
            }
            setTheme(initialTheme);

            // Initialize language
            const savedLang = savedState?.lang;
            setLanguage(savedLang || navigator.language || navigator.userLanguage);
            updateJos3Panel();

            // Event listeners
            dom.langSwitcher.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'zh' : 'en';
                setLanguage(newLang);
                saveInputsToSessionStorage();
            });

            dom.themeToggle.addEventListener('click', toggleTheme);

            dom.addBtn.addEventListener('click', handleAddClothing);
            dom.clearOutfitBtn.addEventListener('click', handleClearOutfit);
            dom.exportCsvBtn.addEventListener('click', handleExportCsv);
            dom.editModalSave.addEventListener('click', handleSaveEdit);
            dom.editModalCancel.addEventListener('click', closeEditModal);
            dom.editModalCloseBtn.addEventListener('click', closeEditModal);
            dom.importCsvBtn.addEventListener('click', handleImportCsv);
            dom.csvFileInput.addEventListener('change', handleFileSelect);
            const noSimTriggerIds = new Set(['jos3-key-filter', 'jos3-raw-key', 'jos3-raw-mode', 'jos3-segment']);
            Object.values(dom).forEach(element => {
                if (element && (element.tagName === 'INPUT' || element.tagName === 'SELECT')) {
                    if (element.id && noSimTriggerIds.has(element.id)) return;
                    const eventHandler = () => {
                        triggerSimulation();
                        saveInputsToSessionStorage();
                    };
                    element.addEventListener('input', eventHandler);
                    element.addEventListener('change', eventHandler);
                }
            });

            // JOS-3 viewer controls
            if (dom.jos3KeyFilter) {
                dom.jos3KeyFilter.addEventListener('input', () => {
                    populateJos3ViewerOptions();
                    renderJos3RawViewer();
                });
            }
            if (dom.jos3RawKey) dom.jos3RawKey.addEventListener('change', renderJos3RawViewer);
            if (dom.jos3RawMode) dom.jos3RawMode.addEventListener('change', renderJos3RawViewer);
            if (dom.jos3Segment) dom.jos3Segment.addEventListener('change', renderJos3RawViewer);
            // Initial Run is triggered by setLanguage

            // Listen for system theme changes
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                    // Only update if user hasn't manually set a theme
                    if (!userHasSetTheme) {
                        setTheme(e.matches ? 'light' : 'dark');
                        saveInputsToSessionStorage();
                    }
                });
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                const savedState = restoreInputsFromSessionStorage();
                setLanguage(savedState?.lang || currentLang);
                setTheme(savedState?.theme || currentTheme);
            }
        });
    </script>

    <div id="edit-modal"
        class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50 transition-opacity duration-300">
        <div class="card p-6 rounded-xl w-full max-w-md m-4 transform transition-all duration-300 scale-95 opacity-0">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold text-white" data-t="edit_clothing_preset"></h2>
                <button id="edit-modal-close-btn"
                    class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <p id="edit-modal-item-name" class="text-violet-300 font-semibold mb-4"></p>
            <div id="edit-modal-body" class="space-y-3">
            </div>
            <div class="mt-6 flex justify-end space-x-4">
                <button id="edit-modal-cancel" class="btn-secondary" data-t="cancel_btn"></button>
                <button id="edit-modal-save" class="btn-secondary bg-violet-600 hover:bg-violet-700"
                    data-t="save_btn"></button>
            </div>
        </div>
    </div>
</body>
