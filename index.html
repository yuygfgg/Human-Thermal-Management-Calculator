<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Thermal Management Calculator v0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style type="text/tailwindcss">
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #111827;
            --border-primary: #30363d;
            --border-secondary: #374151;
            --text-primary: #c9d1d9;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --card-shadow-hover: rgba(139, 92, 246, 0.1);
            --card-border-hover: #8b5cf6;
            --input-focus-ring: rgba(139, 92, 246, 0.5);
            --bg-chart: #111827;
            --bg-outfit-list: #111827;
        }

        [data-theme="light"] {
            --bg-primary: #f9fafb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f3f4f6;
            --border-primary: #e5e7eb;
            --border-secondary: #d1d5db;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            --card-shadow-hover: rgba(139, 92, 246, 0.15);
            --card-border-hover: #8b5cf6;
            --input-focus-ring: rgba(139, 92, 246, 0.5);
            --bg-chart: #f9fafb;
            --bg-outfit-list: #f9fafb;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .transition-all {
            transition: all 0.4s ease-in-out;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px var(--card-shadow-hover), 0 4px 6px -2px var(--card-shadow-hover);
            border-color: var(--card-border-hover);
        }

        .input-field {
            margin-top: 0.25rem;
            display: block;
            width: 100%;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            color: var(--text-primary);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .input-field:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px var(--input-focus-ring);
        }

        .btn-secondary {
            padding: 0.5rem 1rem;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 600;
            border-radius: 0.375rem;
            transition: all 0.2s;
            border: 1px solid var(--border-secondary);
        }

        .btn-secondary:hover {
            background-color: var(--border-secondary);
            border-color: var(--border-primary);
        }

        [data-theme="light"] .btn-secondary:hover {
            background-color: #e5e7eb;
        }

        .btn-secondary:focus {
            outline: none;
            box-shadow: 0 0 0 2px #8b5cf6, 0 0 0 4px var(--bg-primary);
        }

        .chart-line {
            transition: d 0.5s ease-in-out;
        }

        .status-indicator {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 9999px;
            transition: background-color 0.2s, color 0.2s;
        }

        .status-inactive {
            background-color: var(--border-secondary);
            color: var(--text-secondary);
        }

        .status-active {
            background-color: #eab308;
            color: #000000;
        }

        .status-sweating {
            background-color: #3b82f6;
            color: #ffffff;
        }

        /* Chart container specific styling */
        #chart-container {
            background-color: var(--bg-chart) !important;
            border-color: var(--border-secondary) !important;
        }

        /* Outfit list specific styling */
        #current-outfit-list {
            background-color: var(--bg-outfit-list) !important;
            border-color: var(--border-secondary) !important;
        }

        /* Theme toggle button styling */
        .theme-toggle-btn {
            padding: 0.5rem;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 0.375rem;
            transition: all 0.2s;
            border: 1px solid var(--border-secondary);
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-secondary);
            border-color: var(--border-primary);
        }

        /* Icon transitions */
        .theme-icon {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .theme-icon-hidden {
            transform: scale(0);
            opacity: 0;
        }

        /* Adjust text colors for specific elements */
        .text-gray-300 {
            color: var(--text-secondary);
        }

        .text-gray-400 {
            color: var(--text-tertiary);
        }

        .text-gray-500 {
            color: var(--text-tertiary);
        }

        /* Adjust bg colors for outfit items */
        #current-outfit-list .bg-gray-800 {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
        }

        /* Modal background overlay adjustment */
        #edit-modal {
            background-color: rgba(0, 0, 0, 0.75);
        }

        [data-theme="light"] #edit-modal {
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* Hover label styling */
        #hover-label {
            background-color: var(--bg-tertiary) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-secondary);
        }

        /* Adjustments for colored text that should remain colored in light mode */
        [data-theme="light"] .text-white {
            color: var(--text-primary);
        }

        /* Additional style fixes for light mode */
        [data-theme="light"] #simulation-summary .text-white {
            color: #ffffff !important; /* Keep white text on colored backgrounds */
        }

        /* Edit modal content in light mode */
        [data-theme="light"] #edit-modal .card {
            background-color: var(--bg-secondary);
            border-color: var(--border-primary);
        }

        /* Ensure colored backgrounds keep their text colors */
        .bg-red-800, .bg-red-600, .bg-blue-600, .bg-cyan-500,
        .bg-green-600, .bg-yellow-500, .bg-orange-500 {
            color: #ffffff !important;
        }
        
        .bg-yellow-500 {
            color: #000000 !important;
        }

        /* Light mode text visibility on colored elements */
        [data-theme="light"] .text-violet-300 { color: #8b5cf6; }
        [data-theme="light"] .text-sky-300 { color: #0891b2; }
        [data-theme="light"] .text-green-400 { color: #16a34a; }
        [data-theme="light"] .text-yellow-400 { color: #ca8a04; }
        [data-theme="light"] .text-red-400 { color: #dc2626; }
        [data-theme="light"] .text-blue-400 { color: #2563eb; }
        [data-theme="light"] .text-orange-200 { color: #ea580c; }
        [data-theme="light"] .text-orange-300 { color: #ea580c; }
        [data-theme="light"] .text-yellow-300 { color: #ca8a04; }

        .version-badge {
            background-color: #7c3aed; /* bg-violet-600 */
            color: #ffffff;
        }
        [data-theme="light"] .version-badge {
            background-color: transparent;
            color: #7c3aed; /* text-violet-600 */
            border: 1px solid #8b5cf6; /* border-violet-500 */
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="fixed top-4 right-4 z-50 flex items-center space-x-2">
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle theme">
            <svg id="theme-light-icon" class="w-5 h-5 theme-icon theme-icon-hidden" fill="currentColor"
                viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                    fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
            <svg id="theme-dark-icon" class="w-5 h-5 theme-icon" fill="currentColor" viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>
        <button id="lang-switcher" class="btn-secondary" data-t="switch_lang"></button>
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold"><span data-t="main_title"></span> <span
                    class="version-badge text-base rounded-full px-3 py-1 align-middle" data-t="version_badge"></span>
            </h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <div class="space-y-6">
                <div class="card p-6 rounded-xl transition-all card-hover">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-violet-400 pl-3"
                        data-t="param_input"></h2>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-300" data-t="gender"></label>
                            <select id="gender" class="input-field">
                                <option value="male" data-t="male"></option>
                                <option value="female" data-t="female" selected></option>
                            </select>
                        </div>
                        <div>
                            <label for="height" class="block text-sm font-medium text-gray-300" data-t="height"></label>
                            <input type="number" id="height" value="165" class="input-field">
                        </div>
                        <div>
                            <label for="weight" class="block text-sm font-medium text-gray-300" data-t="weight"></label>
                            <input type="number" id="weight" value="50" class="input-field">
                        </div>
                        <div>
                            <label for="age" class="block text-sm font-medium text-gray-300" data-t="age"></label>
                            <input type="number" id="age" value="17" class="input-field">
                        </div>
                        <div>
                            <label for="core-temp" class="block text-sm font-medium text-gray-300"
                                data-t="core_temp"></label>
                            <input type="number" id="core-temp" value="36.6" step="0.1" class="input-field">
                        </div>
                        <div>
                            <label for="temperature" class="block text-sm font-medium text-gray-300"
                                data-t="temperature"></label>
                            <input type="number" id="temperature" value="5" class="input-field">
                        </div>
                        <div>
                            <label for="wind" class="block text-sm font-medium text-gray-300"
                                data-t="wind_speed"></label>
                            <input type="number" id="wind" value="15" class="input-field">
                        </div>
                        <div>
                            <label for="humidity" class="block text-sm font-medium text-gray-300"
                                data-t="humidity"></label>
                            <input type="number" id="humidity" value="50" step="1" min="0" max="100"
                                class="input-field">
                        </div>
                        <div>
                            <label for="medium-k" class="block text-sm font-medium text-gray-300"
                                data-t="medium_thermal_conductivity"></label>
                            <input type="number" id="medium-k" value="0.026" step="0.001" min="0.001"
                                class="input-field">
                        </div>
                        <div>
                            <label for="solar-level" class="block text-sm font-medium text-gray-300"
                                data-t="solar_radiation"></label>
                            <select id="solar-level" class="input-field">
                                <option value="0" data-t="solar_level_no"></option>
                                <option value="200" data-t="solar_level_overcast"></option>
                                <option value="400" data-t="solar_level_cloudy" selected></option>
                                <option value="600" data-t="solar_level_sunny"></option>
                                <option value="800" data-t="solar_level_intense"></option>
                            </select>
                        </div>
                        <div>
                            <label for="activity" class="block text-sm font-medium text-gray-300"
                                data-t="activity_level"></label>
                            <select id="activity" class="input-field">
                                <option value="1.0" data-t="activity_sit"></option>
                                <option value="1.2" data-t="activity_office"></option>
                                <option value="1.5" data-t="activity_light"></option>
                                <option value="2.6" data-t="activity_walk" selected></option>
                                <option value="3.0" data-t="activity_brisk_walk"></option>
                                <option value="6.0" data-t="activity_jog"></option>
                                <option value="8.0" data-t="activity_run"></option>
                                <option value="10.0" data-t="activity_vigorous"></option>
                            </select>
                        </div>
                        <div>
                            <label for="duration" class="block text-sm font-medium text-gray-300"
                                data-t="exposure_duration"></label>
                            <input type="number" id="duration" value="30" class="input-field">
                        </div>
                    </div>
                </div>

                <div class="card p-6 rounded-xl transition-all card-hover">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-cyan-400 pl-3"
                        data-t="outfit_composition"></h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-300" data-t="add_clothing"></label>
                            <div class="flex space-x-2"><select id="clothing-item"
                                    class="input-field flex-grow"></select>
                                <select id="thickness-modifier" class="input-field w-32"></select>
                                <button id="add-clothing-btn" class="btn-secondary" data-t="add_btn"></button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-300" data-t="current_outfit"></label>
                                <button id="clear-outfit-btn"
                                    class="text-xs font-bold text-red-500 hover:text-red-400 transition-colors"
                                    data-t="clear_outfit_btn"></button>
                            </div>
                            <div id="current-outfit-list" class="space-y-2 min-h-[8rem] p-2 rounded-md border">
                                <p id="empty-outfit-msg" class="text-gray-500 italic" data-t="empty_outfit"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="card p-6 rounded-xl">
                    <h2 class="text-xl font-bold mb-4 text-white border-l-4 border-fuchsia-500 pl-3"
                        data-t="dashboard_title"></h2>
                    <div id="simulation-results-container" class="text-center">
                        <div class="mb-6">
                            <div id="simulation-summary"
                                class="text-4xl font-bold p-3 rounded-lg h-24 flex items-center justify-center transition-all duration-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <p class="text-sm text-gray-400" data-t="total_clo"></p>
                                <p id="total-clo" class="text-2xl font-semibold text-violet-300">0.00 Clo</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="effective_clo"></p>
                                <p id="effective-clo" class="text-2xl font-semibold text-sky-300">0.00 Clo</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="physiological_status"></p>
                                <div id="physiology-status-container" class="flex justify-center items-center h-10">
                                    <p id="physiology-status-text" class="text-lg font-semibold text-green-400"
                                        data-t="status_stable">
                                    </p>
                                </div>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400" data-t="comfort_score"></p>
                                <p id="comfort-score" class="text-2xl font-semibold text-gray-500">-- / 100</p>
                            </div>
                        </div>

                        <div id="chart-container" class="w-full h-96 rounded-lg p-2 mt-4 border relative">
                            <canvas id="simulation-chart"></canvas>
                            <div id="hover-label"
                                class="absolute hidden text-white text-xs font-bold px-2 py-1 rounded-md shadow-lg pointer-events-none z-10">
                            </div>
                        </div>
                        <div id="chart-controls" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-2 text-sm">
                        </div>

                        <div id="detailed-status-container" class="mt-6 text-left">
                            <h3 class="text-lg font-bold mb-3 text-white border-b-2 border-gray-700 pb-1"
                                data-t="detailed_status_title"></h3>
                            <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
                                <div></div>
                                <div class="text-right text-xs text-gray-400 -mb-1" data-t="final_avg_header"></div>
                                <!-- Heat Gain -->
                                <div class="text-green-400 font-semibold" data-t="heat_gain"></div>
                                <div></div>
                                <div class="pl-4" data-t="metabolic_gain"></div>
                                <div id="detail-metabolic" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="solar_gain"></div>
                                <div id="detail-solar" class="text-right font-mono">0 W</div>
                                <!-- Heat Loss -->
                                <div class="text-red-400 font-semibold mt-2" data-t="heat_loss"></div>
                                <div></div>
                                <div class="pl-4" data-t="respiratory_loss"></div>
                                <div id="detail-respiratory" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="dry_loss"></div>
                                <div id="detail-dry" class="text-right font-mono">0 W</div>
                                <div class="pl-4" data-t="sweat_loss"></div>
                                <div id="detail-sweat" class="text-right font-mono">0 W</div>
                                <!-- Net -->
                                <div class="text-yellow-400 font-semibold mt-2" data-t="final_net_rate"></div>
                                <div id="detail-net" class="text-right font-mono font-bold">0 W</div>
                                <!-- Response -->
                                <div class="text-blue-400 font-semibold mt-2" data-t="physiological_response"></div>
                                <div></div>
                                <div class="pl-4" data-t="shivering_intensity"></div>
                                <div id="detail-shivering" class="text-right font-mono">0 %</div>
                                <div class="pl-4" data-t="sweating_intensity"></div>
                                <div id="detail-sweating" class="text-right font-mono">0 %</div>
                                <div class="pl-4" data-t="vasoconstriction_intensity"></div>
                                <div id="detail-vasoconstriction" class="text-right font-mono">0 %</div>
                                <div class="pl-4" data-t="vasodilation_intensity"></div>
                                <div id="detail-vasodilation" class="text-right font-mono">0 %</div>
                            </div>
                        </div>

                        <details id="jos3-panel" class="mt-6 text-left">
                            <summary class="text-lg font-bold text-white border-b-2 border-gray-700 pb-1"
                                data-t="jos3_details_title"></summary>
                            <p class="text-xs text-gray-400 mt-2" data-t="jos3_disclaimer"></p>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
                                <div>
                                    <h4 class="text-sm font-bold text-white mb-2" data-t="jos3_skin_table_title"></h4>
                                    <div class="overflow-x-auto rounded-md border border-gray-700">
                                        <table id="jos3-skin-table" class="w-full text-xs"></table>
                                    </div>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white mb-2" data-t="jos3_core_table_title"></h4>
                                    <div class="overflow-x-auto rounded-md border border-gray-700">
                                        <table id="jos3-core-table" class="w-full text-xs"></table>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <h4 class="text-sm font-bold text-white mb-2" data-t="jos3_raw_viewer_title"></h4>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                                    <div>
                                        <label for="jos3-key-filter" class="block text-xs font-medium text-gray-300"
                                            data-t="jos3_filter_label"></label>
                                        <input id="jos3-key-filter" type="text" class="input-field" />
                                    </div>
                                    <div>
                                        <label for="jos3-raw-key" class="block text-xs font-medium text-gray-300"
                                            data-t="jos3_param"></label>
                                        <select id="jos3-raw-key" class="input-field"></select>
                                    </div>
                                    <div>
                                        <label for="jos3-raw-mode" class="block text-xs font-medium text-gray-300"
                                            data-t="jos3_chart_mode"></label>
                                        <select id="jos3-raw-mode" class="input-field">
                                            <option value="auto" data-t="jos3_mode_auto"></option>
                                            <option value="single" data-t="jos3_mode_single"></option>
                                            <option value="all_segments" data-t="jos3_mode_all_segments"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end mt-2">
                                    <div class="md:col-span-1">
                                        <label for="jos3-segment" class="block text-xs font-medium text-gray-300"
                                            data-t="jos3_segment"></label>
                                        <select id="jos3-segment" class="input-field"></select>
                                    </div>
                                    <div class="md:col-span-2 text-xs text-gray-400" id="jos3-raw-meta"></div>
                                </div>
                                <div id="jos3-chart-container" class="w-full h-72 rounded-lg p-2 mt-3 border relative">
                                    <canvas id="jos3-chart"></canvas>
                                </div>
                            </div>
                        </details>

                        <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button id="import-csv-btn" class="btn-secondary w-full" data-t="import_csv_btn"></button>
                            <button id="export-csv-btn" class="btn-secondary w-full" data-t="export_csv_btn"></button>
                            <input type="file" id="csv-file-input" class="hidden" accept=".csv">
                        </div>
                    </div>
                </div>
            </div>

            const tempDiff = coreT - baseCoreT;
            const IDEAL_SKIN_TEMP_LOWER = 32.0;
            const IDEAL_SKIN_TEMP_UPPER = 34.0;

            let skinTempDeviation = 0;
            if (skinT < IDEAL_SKIN_TEMP_LOWER) {
                skinTempDeviation = IDEAL_SKIN_TEMP_LOWER - skinT;
            } else if (skinT > IDEAL_SKIN_TEMP_UPPER) {
                skinTempDeviation = skinT - IDEAL_SKIN_TEMP_UPPER;
            }

            const p_core = Math.abs(tempDiff) * 35;

            if (skinT < IDEAL_SKIN_TEMP_LOWER) {
                p_skin = skinTempDeviation * 8;
            } else if (skinT > IDEAL_SKIN_TEMP_UPPER) {

            const p_response_shiver_sweat = (shiverIntensity + sweatIntensity) * 0.35;

        function calculateEffectiveSegmentClo() {
            const LAYERING_EFFICIENCY = 0.70;
            const eff = {};

            clothingSegmentKeys.forEach(segKey => {
                const layers = currentOutfit
                    .map(item => {
                        const base = (item.segClo && item.segClo[segKey]) ? item.segClo[segKey] : 0;
                        const modifier = item.modifier || 1.0;
                        return base * modifier;
                    })
                    .filter(v => v > 0)
                    .sort((a, b) => b - a);

                let effectiveClo = 0;
                let efficiency = 1.0;
                for (const layerClo of layers) {
                    effectiveClo += layerClo * efficiency;
                    efficiency *= LAYERING_EFFICIENCY;
                }
                eff[segKey] = effectiveClo;
            });

            return eff;
        }

        function calculateIcl17() {
            const eff = calculateEffectiveSegmentClo();
            return [
                eff.Head || 0,   // Head
                eff.Neck || 0,   // Neck
                eff.Chest || 0,  // Chest
                eff.Back || 0,   // Back
                eff.Pelvis || 0, // Pelvis
                eff.Shoulder || 0, // LShoulder
                eff.Arm || 0,      // LArm
                eff.Hand || 0,     // LHand
                eff.Shoulder || 0, // RShoulder
                eff.Arm || 0,      // RArm
                eff.Hand || 0,     // RHand
                eff.Thigh || 0,    // LThigh
                eff.Leg || 0,      // LLeg
                eff.Foot || 0,     // LFoot
                eff.Thigh || 0,    // RThigh
                eff.Leg || 0,      // RLeg
                eff.Foot || 0,     // RFoot
            ];
        }

        function calculateTotalClothingClo() {
            const effSeg = calculateEffectiveSegmentClo();
            let weightedClo = 0;
            let simpleSumClo = 0;

            currentOutfit.forEach(item => {
                const modifier = item.modifier || 1.0;
                const segClo = item.segClo || {};
                for (const k in segClo) {
                    if (segClo.hasOwnProperty(k)) {
                        simpleSumClo += (segClo[k] || 0) * modifier;
                    }
                }
            });

            clothingSegments.forEach(seg => {
                weightedClo += (effSeg[seg.key] || 0) * (seg.area || 0);
            });

            dom.totalClo.textContent = `${simpleSumClo.toFixed(2)} Clo`;
            if (dom.effectiveClo) {
                dom.effectiveClo.textContent = `${weightedClo.toFixed(2)} Clo`;
            }
            return weightedClo;
        }

        async function runSimulation() {
            const gender = dom.gender.value;
            const heightCm = parseFloat(dom.height.value);
            const weightKg = parseFloat(dom.weight.value);
            const age = parseInt(dom.age.value);
            const coreTemp = parseFloat(dom.coreTemp.value);

            if (isNaN(heightCm) || isNaN(weightKg) || isNaN(age) || isNaN(coreTemp) || heightCm <= 0 || weightKg <= 0 || age <= 0) return;

            const clothingClo = calculateTotalClothingClo();
            const totalRespiratoryModifier = currentOutfit.reduce((max, item) => {
                return item.respiratoryModifier && item.respiratoryModifier > max ? item.respiratoryModifier : max;
            }, 0);
            const initialMetValue = parseFloat(dom.activity.value);
            const tempC = parseFloat(dom.temperature.value), windKmh = parseFloat(dom.wind.value), humidityPercent = parseFloat(dom.humidity.value), solarRad = parseFloat(dom.solarLevel.value), durationMins = parseInt(dom.duration.value);
            const windMs = windKmh / 3.6;
            const mediumK = parseFloat(dom.mediumK.value);
            const mediumThermalConductivity = isFinite(mediumK) && mediumK > 0 ? mediumK : 0.026;

            if (isNaN(humidityPercent) || humidityPercent < 0 || humidityPercent > 100) return;
            const icl17 = calculateIcl17();

            const requestId = ++lastSimRequestId;
            try {
                const resp = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sex: gender,
                        height_cm: heightCm,
                        weight_kg: weightKg,
                        age_years: age,
                        base_core_temp_c: coreTemp,
                        air_temp_c: tempC,
                        wind_speed_ms: windMs,
                        rh_percent: humidityPercent,
                        medium_thermal_conductivity_w_mk: mediumThermalConductivity,
                        solar_radiation_wm2: solarRad,
                        activity_met: initialMetValue,
                        duration_min: durationMins,
                        posture: dom.activity.options[dom.activity.selectedIndex].dataset.posture || 'standing',
                        icl17: icl17,
                        // TODO: JOS3 does not take this into account.
                        respiratory_modifier: totalRespiratoryModifier,
                        effective_clo: clothingClo,
                    }),
                });

                if (requestId !== lastSimRequestId) return; // Drop stale responses.

                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data && data.error ? data.error : `HTTP ${resp.status}`);
                }

                lastSimulationResults = data;
                updateUIFromResults();
            } catch (e) {
                // Keep it quiet on transient errors during typing/scrolling.
                console.warn('Simulation failed:', e);
            }
        }

        function updateUIFromResults() {
            if (Object.keys(lastSimulationResults).length === 0) return;

            const {
                vasoActive, dilateActive, shiverActive, sweatActive,
                dataHistory,
                finalTemp, coreTemp, finalSkinTemp, comfortScore,
                finalState, averages
            } = lastSimulationResults;

            updatePhysiologyStatus(vasoActive, dilateActive, shiverActive, sweatActive);
            renderChart(dataHistory);
            updateSimulationSummary(finalTemp, coreTemp, finalSkinTemp, comfortScore);
            updateDetailedStatus(finalState, averages);
            updateJos3Panel();
        }

        function getIntensityKey(type, percentage) {
            if (percentage <= 10) return `${type}_level_0`;
            if (percentage <= 30) return `${type}_level_1`;
            if (percentage <= 60) return `${type}_level_2`;
            if (percentage <= 90) return `${type}_level_3`;
            return `${type}_level_4`;
        }

        function updatePhysiologyStatus(vaso, dilate, shiver, sweat) {
            const t = translations[currentLang];
            const statuses = [];
            if (vaso) statuses.push(t.vasoconstriction);
            if (dilate) statuses.push(t.vasodilation);
            if (shiver) statuses.push(t.shivering);
            if (sweat) statuses.push(t.sweating);

            if (statuses.length > 0) {
                dom.physiologyStatusText.textContent = statuses.join(' | ');
                dom.physiologyStatusText.className = 'text-lg font-semibold text-yellow-400';
            } else {
                dom.physiologyStatusText.textContent = t.status_stable;
                dom.physiologyStatusText.className = 'text-lg font-semibold text-green-400';
            }
        }

        function updateDetailedStatus(finalState, averages) {
            const t = translations[currentLang];
            dom.detailMetabolic.textContent = `${finalState.heatProductionWatts.toFixed(1)} / ${averages.heatProductionWatts.toFixed(1)} W`;
            dom.detailSolar.textContent = `${finalState.solarHeatGainWatts.toFixed(1)} / ${averages.solarHeatGainWatts.toFixed(1)} W`;
            dom.detailRespiratory.textContent = `${finalState.heatLossResp.toFixed(1)} / ${averages.heatLossResp.toFixed(1)} W`;
            dom.detailDry.textContent = `${finalState.heatLossDry.toFixed(1)} / ${averages.heatLossDry.toFixed(1)} W`;
            dom.detailSweat.textContent = `${finalState.sweatingHeatLoss.toFixed(1)} / ${averages.sweatingHeatLoss.toFixed(1)} W`;
            dom.detailNet.textContent = `${finalState.netHeatRateWatts.toFixed(1)} / ${averages.netRate.toFixed(1)} W`;

            const shiveringKey = getIntensityKey('shivering', finalState.shiveringIntensity);
            let shivNote = '';
            if (Number.isFinite(finalState.shiveringSuppressionCoeff) && finalState.shiveringSuppressionCoeff > 0.001) {
                const supPct = (finalState.shiveringSuppressionCoeff * 100).toFixed(0);
                shivNote = currentLang === 'en' ? `, suppressed ${supPct}%` : `，抑制${supPct}%`;
            }
            dom.detailShivering.innerHTML = `${finalState.shiveringIntensity.toFixed(1)} % <span class="text-xs text-gray-400 ml-1">(${t[shiveringKey]}${shivNote})</span>`;

            const sweatingKey = getIntensityKey('sweating', finalState.sweatingIntensity);
            dom.detailSweating.innerHTML = `${finalState.sweatingIntensity.toFixed(1)} % <span class="text-xs text-gray-400 ml-1">(${t[sweatingKey]})</span>`;

            dom.detailVasoconstriction.textContent = `${finalState.vasoconstrictionIntensity.toFixed(1)} %`;
            dom.detailVasodilation.textContent = `${finalState.vasodilationIntensity.toFixed(1)} %`;

        function getJos3Results() {
            return lastSimulationResults?.jos3?.results || null;
        }

        function getJos3SegmentLabel(segKey) {
            const seg = jos3Segments.find(s => s.key === segKey);
            if (!seg) return segKey;
            return currentLang === 'en' ? seg.en : seg.zh;
        }

        function annotateSkinTemp(tskC, segKey) {
            const isExtremity = segKey.includes('Hand') || segKey.includes('Foot');
            const tsk = tskC;

            if (!Number.isFinite(tsk)) return { text: '', cls: 'text-gray-400' };

            // Hot side (rare in this model, but keep a guardrail).
            if (tsk >= 43) {
                return {
                    text: currentLang === 'en' ? '(Very hot: pain/burn risk depends on duration)' : '（很热：疼痛/烫伤风险）',
                    cls: 'text-red-400'
                };
            }
            if (tsk >= 38) {
                return {
                    text: currentLang === 'en' ? '(Hot: discomfort/sweating likely)' : '（偏热：不适/出汗可能↑）',
                    cls: 'text-orange-300'
                };
            }
            if (tsk >= 33) {
                return {
                    text: currentLang === 'en' ? '(Common skin-temp range)' : '（常见皮肤温度）',
                    cls: 'text-green-300'
                };
            }
            if (tsk >= 25) {
                return {
                    text: currentLang === 'en' ? '(Cool)' : '（偏凉）',
                    cls: 'text-sky-300'
                };
            }

            // Cold side.
            if (tsk < 0) {
                return {
                    text: currentLang === 'en' ? '(High frostbite risk: tissue may freeze)' : '（冻伤高风险：组织可能冻结）',
                    cls: 'text-red-400'
                };
            }
            if (tsk < 7) {
                return {
                    text: currentLang === 'en'
                        ? (isExtremity ? '(Very cold: numbness likely in fingers/toes)' : '(Very cold: sensation may be markedly reduced)')
                        : (isExtremity ? '（非常冰冷：手指/脚趾麻木可能性高）' : '（非常冰冷：感觉可能显著下降）'),
                    cls: 'text-orange-300',
                };
            }
            if (tsk < 15) {
                return {
                    text: currentLang === 'en'
                        ? (isExtremity ? '(Cold: pain/dexterity may drop in hands/feet)' : '(Cold: discomfort likely)')
                        : (isExtremity ? '（很冷：手/脚冷痛、灵巧度下降）' : '（很冷：不适可能）'),
                    cls: 'text-yellow-300',
                };
            }
            return {
                text: currentLang === 'en' ? '(Cool: discomfort likely; dexterity may drop)' : '（偏冷：可能不适；灵巧度下降）',
                cls: 'text-yellow-300'
            };
        }

        function renderJos3Tables() {
            if (!dom.jos3SkinTable || !dom.jos3CoreTable) return;
            const t = translations[currentLang];
            const r = getJos3Results();

            if (!r) {
                dom.jos3SkinTable.innerHTML = `<tr><td class="p-2 text-gray-400">${t.jos3_no_data}</td></tr>`;
                dom.jos3CoreTable.innerHTML = `<tr><td class="p-2 text-gray-400">${t.jos3_no_data}</td></tr>`;
                return;
            }

            const th = (cols) => `<tr class="text-gray-400 border-b border-gray-700">${cols.map(c => `<th class="text-left font-semibold p-2">${c}</th>`).join('')}</tr>`;

            // Skin temperature table.
            let skinHtml = th([t.jos3_table_part, 'Tsk', t.jos3_table_note]);
            jos3Segments.forEach(seg => {
                const key = `Tsk${seg.key}`;
                const series = r[key];
                const v = series && series.length ? series[series.length - 1] : NaN;
                const ann = annotateSkinTemp(v, seg.key);
                skinHtml += `<tr class="border-b border-gray-800">
                    <td class="p-2">${getJos3SegmentLabel(seg.key)}</td>
                    <td class="p-2 font-mono">${Number.isFinite(v) ? v.toFixed(2) : '--'}</td>
                    <td class="p-2 ${ann.cls}">${ann.text}</td>
                </tr>`;
            });
            dom.jos3SkinTable.innerHTML = skinHtml;

            // Core temperature table.
            let coreHtml = th([t.jos3_table_part, 'Tcr']);
            jos3Segments.forEach(seg => {
                const key = `Tcr${seg.key}`;
                const series = r[key];
                const v = series && series.length ? series[series.length - 1] : NaN;
                coreHtml += `<tr class="border-b border-gray-800">
                    <td class="p-2">${getJos3SegmentLabel(seg.key)}</td>
                    <td class="p-2 font-mono">${Number.isFinite(v) ? v.toFixed(2) : '--'}</td>
                </tr>`;
            });
            dom.jos3CoreTable.innerHTML = coreHtml;
        }

        function guessJos3Unit(key) {
            if (!key) return '';
            if (key === 'ModTime') return 's';
            if (key.startsWith('T')) return '°C';
            if (key.startsWith('BF')) return 'L/h';
            if (key.startsWith('Wet')) return '';
            if (key === 'Wle') return 'g/s';
            if (['Met', 'RES', 'RESsh', 'RESlh'].includes(key)) return 'W';
            if (key.startsWith('THLsk') || key.startsWith('SHLsk') || key.startsWith('LHLsk')) return 'W';
            if (key.startsWith('Esk') || key.startsWith('Esweat') || key.startsWith('Emax')) return 'W';
            return '';
        }

        function splitJos3KeyFamily(key) {
            if (!key) return null;
            for (const seg of jos3Segments) {
                if (key.endsWith(seg.key)) {
                    return { prefix: key.slice(0, -seg.key.length), seg: seg.key };
                }
            }
            return null;
        }

        function populateJos3ViewerOptions() {
            const r = getJos3Results();
            if (!dom.jos3RawKey || !dom.jos3Segment || !dom.jos3RawMode) return;

            // Segments.
            if (dom.jos3Segment.options.length === 0) {
                jos3Segments.forEach(seg => {
                    const opt = document.createElement('option');
                    opt.value = seg.key;
                    opt.textContent = getJos3SegmentLabel(seg.key);
                    dom.jos3Segment.appendChild(opt);
                });
            } else {
                // Update segment labels on language switch.
                Array.from(dom.jos3Segment.options).forEach((opt, i) => {
                    const seg = jos3Segments[i];
                    if (seg) opt.textContent = getJos3SegmentLabel(seg.key);
                });
            }

            if (!r) {
                dom.jos3RawKey.innerHTML = '';
                return;
            }

            const filter = (dom.jos3KeyFilter?.value || '').trim().toLowerCase();
            const keys = Object.keys(r).filter(k => (filter ? k.toLowerCase().includes(filter) : true));
            keys.sort((a, b) => a.localeCompare(b));

            const favorites = ['Tcb', 'TskMean', 'Met', 'RES', 'WetMean', 'Wle', 'CO'];
            const ordered = [
                ...favorites.filter(k => keys.includes(k)),
                ...keys.filter(k => !favorites.includes(k)),
            ];

            const cur = dom.jos3RawKey.value;
            dom.jos3RawKey.innerHTML = '';
            ordered.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                dom.jos3RawKey.appendChild(opt);
            });

            if (cur && ordered.includes(cur)) {
                dom.jos3RawKey.value = cur;
            } else if (!dom.jos3RawKey.value && ordered.length) {
                dom.jos3RawKey.value = ordered[0];
            }
        }

        function renderJos3RawViewer() {
            const t = translations[currentLang];
            const r = getJos3Results();
            if (!dom.jos3RawKey || !dom.jos3Segment || !dom.jos3Chart || !dom.jos3RawMeta) return;

            if (!r) {
                dom.jos3RawMeta.textContent = t.jos3_no_data;
                if (jos3ChartInstance) {
                    jos3ChartInstance.destroy();
                    jos3ChartInstance = null;
                }
                return;
            }

            const labels = (() => {
                const mod = r.ModTime || [];
                if (mod.length) return mod.map(s => (s / 60).toFixed(0));
                return (lastSimulationResults?.dataHistory?.time || []).map(x => x.toFixed(0));
            })();

            const selectedKey = dom.jos3RawKey.value;
            const selectedSeg = dom.jos3Segment.value || 'Head';
            const mode = dom.jos3RawMode?.value || 'auto';

            const family = splitJos3KeyFamily(selectedKey);
            const wantAll = mode === 'all_segments';
            const datasets = [];

            const segColors = [
                '#a78bfa', '#f97316', '#22c55e', '#3b82f6', '#eab308', '#ec4899',
                '#84cc16', '#06b6d4', '#f59e0b', '#60a5fa', '#34d399', '#fb7185',
                '#c084fc', '#fde047', '#93c5fd', '#fda4af', '#86efac',
            ];

            function sliceToLabels(arr) {
                const n = Math.min(labels.length, arr.length);
                return arr.slice(0, n);
            }

            if (wantAll && family) {
                jos3Segments.forEach((seg, idx) => {
                    const k = `${family.prefix}${seg.key}`;
                    const series = r[k];
                    if (!series || !series.length) return;
                    datasets.push({
                        label: `${family.prefix}${seg.key}`,
                        data: sliceToLabels(series),
                        borderColor: segColors[idx % segColors.length],
                        backgroundColor: segColors[idx % segColors.length],
                        tension: 0.2,
                        borderWidth: 1.5,
                        pointRadius: 0,
                    });
                });
            } else {
                let k = selectedKey;
                if (family) {
                    k = `${family.prefix}${selectedSeg}`;
                }
                const series = r[k] || [];
                datasets.push({
                    label: k,
                    data: sliceToLabels(series),
                    borderColor: '#60a5fa',
                    backgroundColor: '#60a5fa',
                    tension: 0.2,
                    borderWidth: 2,
                    pointRadius: 0,
                });
            }

            const unit = guessJos3Unit(selectedKey);
            const version = lastSimulationResults?.jos3?.version ? `jos3 ${lastSimulationResults.jos3.version}` : 'jos3';
            dom.jos3RawMeta.textContent = `${version} · key=${selectedKey}${unit ? ` (${unit})` : ''} · series=${datasets.length}`;

            const ctx = dom.jos3Chart.getContext('2d');
            if (jos3ChartInstance) {
                jos3ChartInstance.destroy();
            }

            const isDark = currentTheme === 'dark';
            const textColor = isDark ? '#9ca3af' : '#4b5563';
            const gridColor = isDark ? '#374151' : '#e5e7eb';

            jos3ChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: { labels: { color: textColor } }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: currentLang === 'en' ? 'Time (min)' : '时间 (min)', color: textColor },
                            ticks: { color: textColor, maxTicksLimit: 8 },
                            grid: { color: gridColor },
                        },
                        y: {
                            title: { display: true, text: unit || '', color: textColor },
                            ticks: { color: textColor },
                            grid: { color: gridColor },
                        }
                    }
                }
            });
        }

            // Apply stored visibility state

                }
            });

            let y1Used = false;
            let y2Used = false;
            let y3Used = false;
            datasets.forEach(ds => {
                if (!ds.hidden) {
                    if (ds.yAxisID === 'y1') y1Used = true;
                    if (ds.yAxisID === 'y2') y2Used = true;
                    if (ds.yAxisID === 'y3') y3Used = true;
                }
            });

            // Store original border widths for hover effect
            datasets.forEach(d => {
                const defaultWidth = d.borderWidth === undefined ? 1 : d.borderWidth;
                d.originalBorderWidth = defaultWidth;
            });

            simulationChartInstance = new Chart(ctx, {
                type: 'line',

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    animation: false,
                    onHover: (event, chartElements, chart) => {
                        const canvas = chart.canvas;
                        canvas.style.cursor = 'default';
                        dom.hoverLabel.classList.add('hidden');

                        let hoveredDatasetIndex = -1;

                        if (chartElements.length > 0) {
                            let closestElement = null;
                            let minDistance = Infinity;

                            for (const element of chartElements) {
                                const { x, y } = element.element.getCenterPoint();
                                const distance = Math.sqrt(Math.pow(event.x - x, 2) + Math.pow(event.y - y, 2));
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    closestElement = element;
                                }
                            }

                            if (closestElement && minDistance < 15) {
                                const dataset = chart.data.datasets[closestElement.datasetIndex];
                                if (!dataset.hidden) {
                                    hoveredDatasetIndex = closestElement.datasetIndex;
                                }
                            }
                        }

                        chart.data.datasets.forEach((dataset, i) => {
                            dataset.borderWidth = i === hoveredDatasetIndex ? (dataset.originalBorderWidth || 1) + 2 : dataset.originalBorderWidth;
                        });

                        if (hoveredDatasetIndex !== -1) {
                            canvas.style.cursor = 'pointer';
                            const hoveredDataset = chart.data.datasets[hoveredDatasetIndex];

                            dom.hoverLabel.textContent = hoveredDataset.label;
                            dom.hoverLabel.style.color = hoveredDataset.borderColor || hoveredDataset.backgroundColor;

                            const chartRect = dom.chartContainer.getBoundingClientRect();
                            // The 'event' object from onHover is a ChartEvent which wraps the native DOM event.
                            // We use the native event's clientX/Y to get viewport-relative coordinates,
                            // then subtract the container's offset to get the position inside the container.
                            let x = event.native.clientX - chartRect.left + 10;
                            let y = event.native.clientY - chartRect.top + 10;

                            dom.hoverLabel.style.left = `${x}px`;
                            dom.hoverLabel.style.top = `${y}px`;
                            dom.hoverLabel.classList.remove('hidden');
                        }

                        chart.update('none');
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    let label = context.dataset.label || '';
                                    if (label) { label += ': '; }
                                    if (context.parsed.y !== null) { label += context.parsed.y.toFixed(2); }
                                    return label;
                                }
                            }

                            grid: { drawOnChartArea: false },
                            ticks: { color: currentTheme === 'dark' ? '#ec4899' : '#db2777' },
                        },
                        y2: {
                            type: 'linear', display: y2Used, position: 'right',
                            title: { display: true, text: t.intensity_axis_label, color: currentTheme === 'dark' ? '#7dd3fc' : '#0891b2' },
                            grid: { drawOnChartArea: false },

            });

            updateChartControls();

        function updateChartControls() {
            if (!simulationChartInstance) return;
            const t = translations[currentLang];
            const controlsContainer = document.getElementById('chart-controls');
            controlsContainer.innerHTML = '';

            simulationChartInstance.data.datasets.forEach((dataset, index) => {
                const labelText = dataset.label;
                const isHidden = dataset.hidden;
                const color = dataset.borderColor;

                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !isHidden;
                checkbox.id = `chart-toggle-${index}`;
                checkbox.className = 'w-4 h-4 rounded focus:ring-violet-500 bg-gray-700 border-gray-600';
                checkbox.style.borderColor = color;
                checkbox.style.accentColor = color;

                checkbox.addEventListener('change', () => {
                    const isVisible = checkbox.checked;
                    const dataset = simulationChartInstance.data.datasets[index];
                    dataset.hidden = !isVisible;

                    let y1Visible = false;
                    let y2Visible = false;
                    let y3Visible = false;
                    simulationChartInstance.data.datasets.forEach(ds => {
                        if (!ds.hidden) {
                            if (ds.yAxisID === 'y1') y1Visible = true;
                            if (ds.yAxisID === 'y2') y2Visible = true;
                            if (ds.yAxisID === 'y3') y3Visible = true;
                        }
                    });

                    simulationChartInstance.options.scales.y1.display = y1Visible;
                    simulationChartInstance.options.scales.y2.display = y2Visible;
                    simulationChartInstance.options.scales.y3.display = y3Visible;

                    simulationChartInstance.update();

                    // Persist the state
                    if (dataset.key) {
                        chartDatasetVisibility[dataset.key] = isVisible;
                    }
                });

                const label = document.createElement('label');
                label.htmlFor = `chart-toggle-${index}`;
                label.textContent = labelText;
                label.className = 'ml-2 text-sm font-medium';
                label.style.color = color;

                wrapper.appendChild(checkbox);
                wrapper.appendChild(label);
                controlsContainer.appendChild(wrapper);
            });
        }

        function updateSimulationSummary(finalTemp, coreTemp, finalSkinTemp, comfortScore) {
            const t = translations[currentLang];
            const finalTempStr = finalTemp.toFixed(2);
            // The primary interpretation is the comfort score; avoid over-interpreting core temperature deltas.
            let colorClass = 'green-600';
            if (comfortScore < 80) colorClass = 'yellow-500';
            if (comfortScore < 60) colorClass = 'orange-500';
            if (comfortScore < 40) colorClass = 'red-600';

            const skinTempText = `<div class="text-base font-medium mt-1 text-orange-200">${t.final_skin_temp}: ${finalSkinTemp.toFixed(2)}°C</div>`;
            dom.simSummary.innerHTML = `<div><span class="text-4xl">${finalTempStr}°C</span></div>${skinTempText}`;

            let styleClasses = '';
            if (currentTheme === 'light') {
                let textColor = `text-${colorClass}`;
                if (colorClass === 'yellow-500') {
                    textColor = 'text-yellow-600'; // Darker shade for light background
                }
                styleClasses = `border-2 border-${colorClass} ${textColor}`;
            } else { // dark mode
                const darkThemeTextColor = colorClass === 'yellow-500' ? 'text-black' : 'text-white';
                styleClasses = `bg-${colorClass} ${darkThemeTextColor}`;
            }
            dom.simSummary.className = `font-bold p-3 rounded-lg h-24 flex flex-col items-center justify-center text-center transition-all duration-500 ${styleClasses}`;


            // Update comfort score display
            if (dom.comfortScore) {
                let comfortColor = 'text-green-300';
                let comfortKey = 'comfort_ideal';
                if (comfortScore < 80) {
                    comfortColor = 'text-yellow-300';
                    comfortKey = 'comfort_acceptable';
                }
                if (comfortScore < 60) {
                    comfortColor = 'text-orange-300';
                    comfortKey = 'comfort_uncomfortable';
                }
                if (comfortScore < 40) {
                    comfortColor = 'text-red-400';
                    comfortKey = 'comfort_distress';
                }
                lastComfortKey = comfortKey;
                lastComfortText = t[comfortKey];
                dom.comfortScore.innerHTML = `<span class="${comfortColor}">${comfortScore.toFixed(0)} / 100</span> <span class="text-base align-bottom ml-1 ${comfortColor}">(${lastComfortText})</span>`;
            }
        }

        function getFullReportData() {
            const t_en = translations['en'];

            const getModifierTextEn = (modifierValue) => {
                const epsilon = 0.001;
                for (const key in thicknessModifiers) {
                    if (Math.abs(thicknessModifiers[key].value - modifierValue) < epsilon) {
                        return t_en[thicknessModifiers[key].key];
                    }
                }
                return t_en.mod_normal;
            };

            const getIntensityKeyEn = (type, percentage) => {
                if (percentage <= 10) return `${type}_level_0`;
                if (percentage <= 30) return `${type}_level_1`;
                if (percentage <= 60) return `${type}_level_2`;
                if (percentage <= 90) return `${type}_level_3`;
                return `${type}_level_4`;
            };

            const getPhysiologyResponseEn = () => {
                const statuses = [];
                if (lastSimulationResults.vasoActive) statuses.push(t_en.vasoconstriction);
                if (lastSimulationResults.dilateActive) statuses.push(t_en.vasodilation);
                if (lastSimulationResults.shiverActive) statuses.push(t_en.shivering);
                if (lastSimulationResults.sweatActive) statuses.push(t_en.sweating);
                return statuses.length > 0 ? statuses.join(' | ') : t_en.status_stable;
            };

            const solarValue = dom.solarLevel.value;
            const solarOption = dom.solarLevel.querySelector(`option[value="${solarValue}"]`);
            const solarTextKey = solarOption ? solarOption.dataset.t : '';
            const solarTextEn = solarTextKey ? t_en[solarTextKey] : '';

            const activityValue = parseFloat(dom.activity.value);
            const activityLevel = activityLevels.find(level => Math.abs(level.met - activityValue) < 0.01);
            const activityTextEn = activityLevel ? activityLevel.name_en : '';

            const inputs = {
                gender: dom.gender.value,
                height_cm: parseFloat(dom.height.value),
                weight_kg: parseFloat(dom.weight.value),
                age_years: parseInt(dom.age.value),
                base_core_temp_c: parseFloat(dom.coreTemp.value),
                air_temp_c: parseFloat(dom.temperature.value),
                wind_speed_kmh: parseFloat(dom.wind.value),
                relative_humidity_percent: parseFloat(dom.humidity.value),
                medium_thermal_conductivity_w_mk: parseFloat(dom.mediumK.value),
                solar_radiation_wm2: parseFloat(dom.solarLevel.value),
                solar_radiation_text_en: solarTextEn,
                activity_met: parseFloat(dom.activity.value),
                activity_text_en: activityTextEn,
                duration_min: parseInt(dom.duration.value),
                outfit: currentOutfit.map(item => ({
                    name_en: item.name_en,
                    segClo: item.segClo,
                    thickness_modifier: item.modifier,
                    thickness_modifier_text: getModifierTextEn(item.modifier),
                })),
            };

            const shiveringIntensity = parseFloat(dom.detailShivering.textContent);
            const sweatingIntensity = parseFloat(dom.detailSweating.textContent);

            const outputs = {
                total_clo_sum: parseFloat(dom.totalClo.textContent),
                effective_clo_weighted: parseFloat(dom.effectiveClo.textContent),
                final_core_temp_c: parseFloat(dom.simSummary.querySelector('span').textContent),
                final_skin_temp_c: parseFloat(dom.simSummary.querySelector('.text-orange-200').textContent.split(': ')[1]),
                physiological_response: getPhysiologyResponseEn(),
                overall_comfort_score: parseFloat(dom.comfortScore.textContent.split(' / ')[0]),
                overall_comfort_text: t_en[lastComfortKey] || '',
                detailed_heat_balance_watts: {
                    metabolic_gain: parseFloat(dom.detailMetabolic.textContent.split(' / ')[0]),
                    solar_gain: parseFloat(dom.detailSolar.textContent.split(' / ')[0]),
                    respiratory_loss: parseFloat(dom.detailRespiratory.textContent.split(' / ')[0]),
                    dry_skin_loss: parseFloat(dom.detailDry.textContent.split(' / ')[0]),
                    sweat_evaporation_loss: parseFloat(dom.detailSweat.textContent.split(' / ')[0]),
                    final_net_rate: parseFloat(dom.detailNet.textContent.split(' / ')[0]),
                },
                average_heat_balance_watts: {
                    metabolic_gain: lastSimulationResults.averages?.heatProductionWatts ?? null,
                    solar_gain: lastSimulationResults.averages?.solarHeatGainWatts ?? null,
                    respiratory_loss: lastSimulationResults.averages?.heatLossResp ?? null,
                    dry_skin_loss: lastSimulationResults.averages?.heatLossDry ?? null,
                    sweat_evaporation_loss: lastSimulationResults.averages?.sweatingHeatLoss ?? null,
                    net_rate: lastSimulationResults.averages?.netRate ?? null,
                },
                physiological_response_intensity_percent: {
                    shivering: shiveringIntensity,
                    shivering_text_en: t_en[getIntensityKeyEn('shivering', shiveringIntensity)],
                    sweating: sweatingIntensity,
                    sweating_text_en: t_en[getIntensityKeyEn('sweating', sweatingIntensity)],
                    vasoconstriction: parseFloat(dom.detailVasoconstriction.textContent),
                    vasodilation: parseFloat(dom.detailVasodilation.textContent),
                }
            };
            return { inputs, results: outputs };
        }

        function handleExportCsv() {
            if (!lastSimulationResults || Object.keys(lastSimulationResults).length === 0) {
                alert(currentLang === 'en' ? 'No simulation data to export.' : '没有可导出的仿真数据。');
                return;
            }

            const fullReportData = getFullReportData();
            let csvRows = [];

            // Minimal CSV cell escaping for our generated values.
            const csvCell = (v) => {
                if (v === null || v === undefined) return '';
                let s = String(v);
                if (!s) return '';
                if (s.includes('"')) s = s.replace(/"/g, '""');
                return /[",\n\r]/.test(s) ? `"${s}"` : s;
            };

            csvRows.push('"Inputs"');
            csvRows.push('"Parameter","Value"');
            Object.entries(fullReportData.inputs).forEach(([key, value]) => {
                if (key === 'outfit') {
                    csvRows.push(`"outfit",""`);
                    value.forEach((item, index) => {
                        csvRows.push(`"  ${index + 1}: name_en","${item.name_en}"`);
                        csvRows.push(`"  ${index + 1}: thickness_modifier","${item.thickness_modifier}"`);
                        csvRows.push(`"  ${index + 1}: thickness_modifier_text","${item.thickness_modifier_text}"`);
                        Object.entries(item.segClo || {}).forEach(([seg, clo]) => {
                            csvRows.push(`"    - ${seg} Clo","${clo}"`);
                        });
                    });
                } else {
                    csvRows.push(`"${key}","${value}"`);
                }
            });
            csvRows.push('');

            csvRows.push('"Results"');
            csvRows.push('"Result","Value"');
            const flattenResults = (obj, prefix = '', rows = []) => {
                Object.entries(obj).forEach(([key, value]) => {
                    const newKey = prefix ? `${prefix} - ${key}`.replace(/_/g, ' ') : key.replace(/_/g, ' ');
                    if (typeof value === 'object' && value !== null) {
                        flattenResults(value, newKey, rows);
                    } else {
                        rows.push(`"${newKey}","${value}"`);
                    }
                });
                return rows;
            }
            csvRows.push(...flattenResults(fullReportData.results));
            csvRows.push('');
            csvRows.push('');


            if (simulationChartInstance) {
                csvRows.push('"Time Series Data"');
                const t_en = translations['en'];
                const { labels, datasets } = simulationChartInstance.data;

                const headers = [`"${t_en.time_axis_label}"`, ...datasets.map(ds => `"${t_en[ds.key] || ds.label}"`)];
                csvRows.push(headers.join(','));

                const numPoints = labels.length;
                if (numPoints > 0) {
                    for (let i = 0; i < numPoints; i++) {
                        const row = [labels[i]];
                        datasets.forEach(ds => {
                            const value = ds.data[i];
                            row.push(typeof value === 'number' ? value.toFixed(4) : '');
                        });
                        csvRows.push(row.join(','));
                    }
                }
            }


            // Raw JOS-3 dump (all keys + all timesteps), as returned by the backend.
            const jos3Raw = lastSimulationResults?.jos3?.results;
            if (jos3Raw && typeof jos3Raw === 'object' && Object.keys(jos3Raw).length) {
                csvRows.push('');
                csvRows.push('');
                csvRows.push('"JOS3 Raw Data"');
                if (lastSimulationResults?.jos3?.version) {
                    csvRows.push(`"jos3_version",${csvCell(lastSimulationResults.jos3.version)}`);
                }

                const rawKeys = Object.keys(jos3Raw);
                const keys = [
                    ...(rawKeys.includes('ModTime') ? ['ModTime'] : []),
                    ...rawKeys.filter(k => k !== 'ModTime').sort((a, b) => a.localeCompare(b)),
                ];

                csvRows.push(keys.map(k => csvCell(k)).join(','));

                const n = (() => {
                    const mod = Array.isArray(jos3Raw.ModTime) ? jos3Raw.ModTime.length : 0;
                    if (mod) return mod;
                    let best = 0;
                    keys.forEach(k => {
                        const arr = jos3Raw[k];
                        if (Array.isArray(arr) && arr.length > best) best = arr.length;
                    });
                    return best;
                })();

                for (let i = 0; i < n; i++) {
                    const row = keys.map(k => {
                        const arr = jos3Raw[k];
                        const v = Array.isArray(arr) ? arr[i] : '';
                        if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
                        return csvCell(v);
                    });
                    csvRows.push(row.join(','));
                }
            }


            const csvString = csvRows.join('\n');
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvString], { type: 'text/csv;charset=utf-8;' });

            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `thermal_simulation_report_${new Date().toISOString().replace(/:/g, '-')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
